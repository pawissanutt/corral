<!doctype html>
<html lang="en" class="t-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System map · Corral</title>
<link rel="stylesheet" href="../app-design/mockup/css/fonts.css">
<style>
:root {
  --sans: "Atkinson Hyperlegible Next", system-ui, sans-serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, monospace;
  --side-w: 208px;
  --side-w-min: 52px;
  --insp-w: 320px;
}
.t-dark {
  color-scheme: dark;
  --bg: oklch(0.195 0.012 240); --ink: oklch(0.94 0.006 240);
  --surface: oklch(0.225 0.013 240); --surface-2: oklch(0.255 0.014 240); --bg-sunk: oklch(0.17 0.012 240);
  --rule: oklch(0.29 0.012 240); --rule-2: oklch(0.36 0.014 240);
  --ink-2: oklch(0.80 0.010 240); --ink-3: oklch(0.72 0.012 240); --ink-4: oklch(0.66 0.012 240);
  --sel: oklch(0.275 0.03 240); --hover: oklch(0.24 0.016 240); --focus: oklch(0.86 0.09 215);
  --selection: oklch(0.86 0.09 215 / 0.35);
  --shell: oklch(0.155 0.022 238); --shell-ink: oklch(0.86 0.012 238); --shell-ink-2: oklch(0.70 0.016 238);
  --shell-sel: oklch(0.255 0.035 238); --shell-rule: oklch(0.27 0.02 238);
  --primary: oklch(0.93 0.006 240); --primary-ink: oklch(0.18 0.012 240);
  --you: oklch(0.76 0.15 58); --you-bg: oklch(0.27 0.05 58);
  --corral: oklch(0.74 0.12 278); --corral-bg: oklch(0.27 0.05 278);
  --worker: oklch(0.78 0.10 200); --worker-bg: oklch(0.27 0.04 200);
  --held: oklch(0.84 0.13 92); --held-bg: oklch(0.29 0.05 92);
  --fail: oklch(0.70 0.18 25); --fail-bg: oklch(0.27 0.06 25);
  --ok: oklch(0.78 0.13 152); --ok-bg: oklch(0.26 0.045 152);
  --edge: oklch(0.62 0.012 240);
  --lang-1: oklch(0.80 0.010 240); --lang-2: oklch(0.62 0.012 240); --lang-3: oklch(0.48 0.012 240); --lang-4: oklch(0.40 0.012 240); --lang-5: oklch(0.34 0.012 240);
  --shadow: 0 12px 32px -8px oklch(0 0 0 / 0.55); --shade: oklch(0 0 0 / 0.55);
}
.t-light {
  color-scheme: light;
  --bg: oklch(0.977 0.003 230); --ink: oklch(0.21 0.02 245);
  --surface: oklch(0.995 0.002 230); --surface-2: oklch(0.945 0.006 230); --bg-sunk: oklch(0.955 0.005 230);
  --rule: oklch(0.89 0.007 235); --rule-2: oklch(0.80 0.01 235);
  --ink-2: oklch(0.36 0.02 245); --ink-3: oklch(0.44 0.018 245); --ink-4: oklch(0.51 0.014 245);
  --sel: oklch(0.925 0.02 238); --hover: oklch(0.955 0.008 238); --focus: oklch(0.50 0.14 245);
  --selection: oklch(0.50 0.14 245 / 0.25);
  --shell: oklch(0.27 0.035 240); --shell-ink: oklch(0.95 0.008 238); --shell-ink-2: oklch(0.80 0.02 238);
  --shell-sel: oklch(0.36 0.045 238); --shell-rule: oklch(0.36 0.035 240);
  --primary: oklch(0.24 0.025 245); --primary-ink: oklch(0.98 0.004 240);
  --you: oklch(0.52 0.16 50); --you-bg: oklch(0.95 0.04 60);
  --corral: oklch(0.50 0.16 278); --corral-bg: oklch(0.95 0.03 278);
  --worker: oklch(0.50 0.10 215); --worker-bg: oklch(0.95 0.025 205);
  --held: oklch(0.51 0.12 80); --held-bg: oklch(0.95 0.05 92);
  --fail: oklch(0.53 0.19 27); --fail-bg: oklch(0.95 0.035 25);
  --ok: oklch(0.50 0.13 152); --ok-bg: oklch(0.95 0.035 152);
  --edge: oklch(0.55 0.014 245);
  --lang-1: oklch(0.36 0.02 245); --lang-2: oklch(0.55 0.016 245); --lang-3: oklch(0.70 0.012 245); --lang-4: oklch(0.79 0.010 245); --lang-5: oklch(0.86 0.008 245);
  --shadow: 0 12px 32px -10px oklch(0.3 0.03 245 / 0.28); --shade: oklch(0.2 0.02 240 / 0.25);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
::selection { background: var(--selection); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--rule-2); border-radius: 6px; border: 2px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }
* { scrollbar-color: var(--rule-2) transparent; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell: title bar, sidebar and scope switcher, as in docs/app-design/mockup/redesign.html ---------- */
.app { position: relative; display: grid; grid-template-rows: 36px minmax(0, 1fr); grid-template-columns: var(--side-w) minmax(0, 1fr); height: 100vh; background: var(--bg); overflow: hidden; }
.app.side-min { grid-template-columns: var(--side-w-min) minmax(0, 1fr); }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.titlebar { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 12px 0 14px; background: var(--shell); color: var(--shell-ink); border-bottom: 1px solid var(--shell-rule); font-size: 12px; white-space: nowrap; min-width: 0; overflow: hidden; user-select: none; }
.tbtn { display: inline-flex; color: var(--shell-ink-2); border: 0; background: none; border-radius: 5px; padding: 3px; }
.tbtn:hover { color: var(--shell-ink); background: oklch(1 0 0 / .06); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 13px; }
.brand .mk { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.5; }
.titlebar .path { color: var(--shell-ink-2); font-family: var(--mono); }
.titlebar .sp { flex: 1; }
.sample { border: 1px solid oklch(0.84 0.13 92 / .55); color: oklch(0.84 0.13 92); border-radius: 4px; padding: 1px 6px; font-family: var(--mono); font-size: 11px; }

.side { grid-column: 1; grid-row: 2; background: var(--shell); color: var(--shell-ink); display: flex; flex-direction: column; gap: 2px; padding: 10px 8px; border-right: 1px solid var(--shell-rule); min-height: 0; overflow: auto; z-index: 20; }
.scope { flex: none; width: 100%; display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 9px; margin-bottom: 10px; border: 1px solid var(--shell-rule); border-radius: 7px; background: none; color: oklch(0.97 0.005 238); font-weight: 650; text-align: left; }
.scope:hover, .scope[aria-expanded="true"] { background: oklch(1 0 0 / .05); }
.scope .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.2; }
.scope small { display: block; font-weight: 400; font-size: 11px; color: var(--shell-ink-2); line-height: 1.1; }
.nav { flex: none; display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 9px; border-radius: 6px; color: var(--shell-ink-2); font-weight: 500; text-decoration: none; white-space: nowrap; }
.nav:hover { background: oklch(1 0 0 / .05); color: var(--shell-ink); }
.nav.on { background: var(--shell-sel); color: oklch(0.97 0.005 238); font-weight: 650; }
.nav.sub { height: 26px; padding-left: 35px; font-size: 12.5px; }
.nav kbd { margin-left: auto; width: 26px; text-align: right; font: 11px var(--mono); color: var(--shell-ink-2); opacity: .75; }
.side .grow { flex: 1; }
.app.side-min .side .lbl, .app.side-min .side kbd, .app.side-min .nav.sub, .app.side-min .scope .chev { display: none; }
.app.side-min .nav, .app.side-min .scope { justify-content: center; padding: 0; }
.app.side-overlay .side { position: fixed; top: 36px; bottom: 0; left: 0; width: var(--side-w); box-shadow: var(--shadow); }
.app.side-overlay .side .lbl, .app.side-overlay .side kbd, .app.side-overlay .scope .chev { display: revert; }
.app.side-overlay .nav.sub { display: flex; }
.app.side-overlay .nav { justify-content: flex-start; padding: 0 9px; }
.app.side-overlay .nav.sub { padding-left: 35px; }
.app.side-overlay .scope { justify-content: flex-start; padding: 0 9px; }

/* the scope menu: one scope for every page */
.menu { position: fixed; z-index: 50; min-width: 250px; background: var(--surface); border: 1px solid var(--rule-2); border-radius: 8px; box-shadow: 0 18px 40px -16px var(--shade); padding: 5px; }
.menu .mh { padding: 5px 9px 3px; font-size: 11.5px; color: var(--ink-3); }
.mi { display: flex; gap: 14px; align-items: baseline; width: 100%; padding: 5px 9px; border: 0; border-radius: 5px; background: none; color: var(--ink); font-weight: 600; text-align: left; }
.mi:hover, .mi.act { background: var(--hover); }
.mi[aria-checked="true"] { background: var(--sel); }
.mi small { margin-left: auto; color: var(--ink-3); font-weight: 400; font-size: 12px; white-space: nowrap; }

main { grid-column: 2; grid-row: 2; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
.page { display: none; flex: 1; min-height: 0; flex-direction: column; }
.page.on { display: flex; }

/* page header */
.phead { flex: none; display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding: 12px 20px 11px; min-height: 52px; border-bottom: 1px solid var(--rule); }
.phead h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.phead .say { color: var(--ink-2); }
.seg { display: inline-flex; flex: none; border: 1px solid var(--rule-2); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 2px 9px; height: 22px; color: var(--ink); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.seg button:hover { background: var(--hover); }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--primary); color: var(--primary-ink); font-weight: 650; }
.seg .kk { font-family: var(--mono); font-size: 11px; color: var(--ink-4); font-weight: 400; }
.seg .cnt { font-family: var(--mono); font-size: 11px; color: var(--ink-3); font-weight: 400; }
.seg button[aria-pressed="true"] .kk, .seg button[aria-selected="true"] .kk, .seg button[aria-selected="true"] .cnt { color: inherit; opacity: .7; }
.spacer { flex: 1; }
.filter { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 6px 0 9px; border-radius: 6px; border: 1px solid var(--rule-2); background: var(--bg-sunk); width: 300px; color: var(--ink-3); flex: none; }
.filter:focus-within { border-color: var(--focus); }
.filter input { border: 0; background: transparent; outline: none; flex: 1; min-width: 0; font-size: 12.5px; color: var(--ink); }
.filter input::placeholder { color: var(--ink-4); }
.filter input::-webkit-search-cancel-button { display: none; }
.filter .qn { font-family: var(--mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--rule-2); border-radius: 4px; padding: 0 5px; line-height: 16px; color: var(--ink-3); }
.mini { font-size: 11.5px; color: var(--ink-3); }

/* crumb bar: where you are on the map, and what the whole project holds */
.crumbs { flex: none; display: flex; align-items: center; gap: 4px 14px; padding: 7px 16px 7px 12px; min-height: 40px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.bc { display: flex; align-items: center; gap: 2px; min-width: 0; flex-wrap: wrap; }
.bc button { border: 0; background: transparent; height: 26px; padding: 0 6px; border-radius: 5px; color: var(--ink-3); font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; max-width: 320px; }
.bc button span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bc button:hover { background: var(--hover); color: var(--ink); }
.bc button[aria-current="location"] { color: var(--ink); font-weight: 600; cursor: default; }
.bc button[aria-current="location"]:hover { background: transparent; }
.bc button .lv { font-size: 11px; color: var(--ink-4); font-weight: 400; }
.bc .sep { color: var(--ink-4); display: inline-flex; }
.bc .mono { font-size: 12px; }
.bc .esc { margin-left: 6px; }
.sumline { margin-left: auto; font-size: 11.5px; color: var(--ink-3); display: flex; gap: 4px 12px; flex-wrap: wrap; justify-content: flex-end; }
.sumline b { color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }

/* work area */
.work { flex: 1; min-height: 0; display: flex; position: relative; }
.stage { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.canvas { flex: 1; min-height: 0; overflow: auto; display: flex; justify-content: safe center; align-items: safe center; padding: 14px 16px 6px; position: relative; }
.canvas > svg { display: block; overflow: visible; flex: none; }
.stagefoot { flex: none; display: flex; align-items: center; gap: 6px 18px; padding: 6px 16px 8px; min-height: 32px; font-size: 11.5px; color: var(--ink-3); flex-wrap: wrap; border-top: 1px solid var(--rule); }
.legend { display: flex; gap: 4px 16px; align-items: center; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.prov { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-4); white-space: nowrap; }
.sw { display: inline-block; width: 14px; height: 8px; border-radius: 2px; }
.sw.hatch { background: repeating-linear-gradient(135deg, var(--ink-4) 0 1px, transparent 1px 4px); box-shadow: inset 0 0 0 1px var(--rule-2); }
.sw.ramp { width: 44px; background: linear-gradient(90deg, color-mix(in oklch, var(--worker) 6%, var(--surface)), color-mix(in oklch, var(--worker) 42%, var(--surface))); box-shadow: inset 0 0 0 1px var(--rule-2); }
.lsw { display: inline-block; width: 22px; height: 0; border-top: 2px solid var(--edge); vertical-align: middle; }
.lsw.zero { border-top: 1.5px dashed var(--ink-4); }
.lsw.undecl { border-top-color: var(--held); }
.lsw.spawn { border-top: 2px dotted var(--ink-3); }
.pchip-sw { display: inline-block; width: 24px; height: 12px; border-radius: 6px; border: 1px dashed var(--ink-4); background: var(--bg-sunk); }
.lsw.auto { border-top: 2px dashed var(--corral); }
.lsw.delta { border-top: 2.5px solid var(--you); }
.bx { display: inline-block; width: 16px; height: 11px; border-radius: 3px; border: 1.2px solid var(--rule-2); background: var(--surface); }
.bx.touch { border: 2px solid var(--you); }
.bx.dep { border: 1.5px dashed var(--corral); }
.bx.dim { opacity: .4; }
.bx.excl { border-style: dashed; background: transparent; }
.bx.folder { background: transparent; border-color: var(--rule); }

/* svg map */
svg text { font-family: var(--sans); fill: var(--ink); }
.dg .frame { fill: none; stroke: var(--rule-2); stroke-dasharray: 2 4; }
.dg .frame.solid { stroke-dasharray: none; stroke: var(--rule); fill: color-mix(in oklch, var(--surface) 30%, transparent); }
.dg .frame-t { font-size: 12px; fill: var(--ink-3); font-weight: 600; }
.dg .frame-t.mono { font-family: var(--mono); font-weight: 400; }
.dg .frame-s { font-size: 11.5px; fill: var(--ink-4); }
.dg .card { cursor: pointer; }
.dg .card .box { fill: var(--surface); stroke: var(--rule-2); stroke-width: 1.2; transition: stroke .12s ease-out; }
.dg .card:hover .box { stroke: var(--ink-4); }
.dg .card .nm { font-family: var(--mono); font-size: 13px; font-weight: 600; }
.dg .card .tag { font-family: var(--mono); font-size: 10.5px; fill: var(--ink-4); }
.dg .card .sub { font-size: 11.5px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.dg .card .sub .p { fill: var(--ok); font-family: var(--mono); font-size: 11px; }
.dg .card .sub .m { fill: var(--fail); font-family: var(--mono); font-size: 11px; }
.dg .card .trk { fill: var(--rule); }
.dg .card .hat { fill: url(#hatch); }
.dg .card.k-folder .box { fill: transparent; stroke: var(--rule); }
.dg .card.k-folder .nm { fill: var(--ink-2); font-weight: 500; }
.dg .card.ws-excluded .box { fill: transparent; stroke-dasharray: 4 3; }
.dg .card.ws-excluded .nm { fill: var(--ink-2); }
.dg .card.k-proc .box, .dg .card.k-port .box { fill: var(--bg-sunk); }
.dg .card.k-port .nm, .dg .card.k-proc .nm { font-size: 12px; font-weight: 600; }
.dg .card.k-more .box { fill: transparent; stroke-dasharray: 2 3; }
.dg .card.k-more .nm { fill: var(--ink-2); font-family: var(--sans); font-weight: 600; font-size: 12.5px; }
.dg .card.k-def .box { fill: var(--surface); }
.dg .card.k-empty { cursor: default; }
.dg .card.k-empty .box { fill: transparent; stroke: var(--rule); stroke-dasharray: 2 3; }
.dg .card.k-empty .nm { font-family: var(--sans); font-weight: 500; fill: var(--ink-3); font-size: 12.5px; }
.dg .drow { cursor: pointer; }
.dg .drow .dbg { fill: transparent; }
.dg .drow:hover .dbg { fill: var(--hover); }
.dg .drow text { font-family: var(--mono); font-size: 12px; fill: var(--ink-2); }
.dg .drow .ln { font-size: 11px; fill: var(--ink-4); }
.dg .drow.sel .dbg { fill: var(--sel); stroke: var(--ink); stroke-width: 1.5; }
.dg .drow:focus-visible .dbg { stroke: var(--focus); stroke-width: 2; }
.dg .drow.hit .dbg { stroke: var(--focus); stroke-dasharray: 3 2; }
.dg .drow.fp-touch .dbg { fill: color-mix(in oklch, var(--you) 16%, transparent); }
.dg .ring { fill: none; stroke: transparent; stroke-width: 2.5; pointer-events: none; }
.dg .sel > .ring { stroke: var(--ink); }
.dg [data-id]:focus-visible > .ring { stroke: var(--focus); }
.dg .hit > .ring { stroke: var(--focus); stroke-dasharray: 4 3; }
.dg .hitn { font-family: var(--mono); font-size: 10.5px; font-weight: 700; fill: var(--focus); }
.dg .e { cursor: pointer; }
.dg .e .ln { fill: none; stroke: var(--edge); stroke-linecap: round; stroke-linejoin: round; }
.dg .e .halo { fill: none; stroke: var(--bg); stroke-linecap: round; }
.dg .e .hitln { fill: none; stroke: transparent; stroke-width: 12; }
.dg .e .ah { fill: var(--edge); }
.dg .e.c-zero .ln { stroke: var(--ink-4); stroke-dasharray: 5 4; }
.dg .e.c-zero .ah { fill: none; stroke: var(--ink-4); stroke-width: 1.2; }
.dg .e.c-undecl .ln { stroke: var(--held); }
.dg .e.c-undecl .ah { fill: var(--held); }
.dg .e.c-spawn .ln { stroke: var(--ink-3); stroke-dasharray: 0.5 4.5; stroke-width: 2.2; }
.dg .e.c-spawn .ah { fill: var(--ink-3); }
.dg .e.c-port .ln { stroke-dasharray: 6 3; }
.dg .e:hover .ln, .dg .e.lit .ln { stroke: var(--ink-2); }
.dg .e.c-undecl:hover .ln, .dg .e.c-undecl.lit .ln { stroke: var(--held); }
.dg .e:hover .ah, .dg .e.lit .ah { fill: var(--ink-2); }
.dg .e.c-zero.lit .ah, .dg .e.c-zero:hover .ah { fill: none; stroke: var(--ink-2); }
.dg .e.sel .ln { stroke: var(--ink); }
.dg .e.sel .ah { fill: var(--ink); }
.dg .e:focus-visible .ln { stroke: var(--focus); }
.dg .e.hit .ln { stroke: var(--focus); }
.dg .e.fp-delta .ln { stroke: var(--you); }
.dg .e.fp-delta .ah { fill: var(--you); }
.dg .e.extra .ln { stroke: var(--ink-2); stroke-dasharray: 2 3; }
.dg .e.extra .ah { fill: var(--ink-2); }
.dg .elbl rect { fill: var(--bg); stroke: var(--rule-2); }
.dg .elbl text { font-size: 11px; font-weight: 600; fill: var(--ink-3); }
.dg .elbl.c-undecl rect { stroke: var(--held); }
.dg .elbl.c-undecl text { fill: var(--held); }
.dg .elbl.fp-delta rect { stroke: var(--you); }
.dg .elbl.fp-delta text { fill: var(--you); font-family: var(--mono); }
.dg.focusing .e:not(.lit):not(.sel) { opacity: .1; }
.dg.focusing .elbl:not(.lit) { opacity: .1; }
.dg.focusing .card:not(.lit):not(.sel) { opacity: .4; }
.dg .dimmed { opacity: .25; }
/* footprint: touched (solid, owner orange) differs from dependents (dashed, Corral indigo) by stroke shape, not only colour */
.dg .card.fp-touch .box { stroke: var(--you); stroke-width: 2.2; }
.dg .card.fp-dep .box { stroke: var(--corral); stroke-width: 1.6; stroke-dasharray: 5 3; }
.dg .card.fp-touch.fp-dep .box { stroke-dasharray: none; }
.dg .card .depmk { fill: var(--corral-bg); stroke: var(--corral); stroke-dasharray: 2 2; }
.dg .card .depn { font-family: var(--mono); font-size: 10.5px; font-weight: 700; fill: var(--corral); }
.dg .card.fp-none { opacity: .32; }
.dg .card.fp-none:hover, .dg .card.fp-none:focus-visible, .dg .card.fp-none.sel { opacity: .8; }
.dg .e.fp-none { opacity: .16; }
.dg .pchip { cursor: pointer; }

function renderImpact(M) {

function focusIn(q) { requestAnimationFrame(() => { const e = $(q); if (e) e.focus(); }); }
