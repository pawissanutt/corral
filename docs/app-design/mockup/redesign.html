<!doctype html>
<html lang="en" class="t-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corral app redesign: reference</title>
<!-- Standalone: everything is in this file. The brand fonts are optional; when css/fonts.css is
     not beside this file the page uses system fonts. Brief: ../REDESIGN.md -->
<link rel="stylesheet" href="css/fonts.css">
<style>
:root{
  --font:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
.t-dark{
  color-scheme:dark;
  --bg:oklch(.195 .012 240);--sunk:oklch(.17 .012 240);--surface:oklch(.225 .013 240);--surface-2:oklch(.255 .014 240);
  --shell:oklch(.155 .022 238);--shell-ink:oklch(.86 .012 238);--shell-ink-2:oklch(.70 .016 238);--shell-sel:oklch(.255 .035 238);--shell-rule:oklch(.27 .02 238);
  --rule:oklch(.29 .012 240);--rule-2:oklch(.36 .014 240);
  --ink:oklch(.94 .006 240);--ink-2:oklch(.80 .010 240);--ink-3:oklch(.72 .012 240);--ink-4:oklch(.62 .012 240);
  --sel:oklch(.275 .03 240);--hover:oklch(.24 .016 240);--focus:oklch(.86 .09 215);--selection:oklch(.86 .09 215/.35);
  --primary:oklch(.93 .006 240);--primary-ink:oklch(.18 .012 240);
  --you:oklch(.76 .15 58);--you-bg:oklch(.27 .05 58);--corral:oklch(.74 .12 278);--worker:oklch(.78 .10 200);
  --fail:oklch(.70 .18 25);--fail-bg:oklch(.27 .06 25);--ok:oklch(.78 .13 152);--ok-bg:oklch(.26 .045 152);
  --shade:oklch(0 0 0/.55);
}
.t-light{
  color-scheme:light;
  --bg:oklch(.977 .003 230);--sunk:oklch(.955 .005 230);--surface:oklch(.995 .002 230);--surface-2:oklch(.945 .006 230);
  --shell:oklch(.27 .035 240);--shell-ink:oklch(.95 .008 238);--shell-ink-2:oklch(.80 .02 238);--shell-sel:oklch(.36 .045 238);--shell-rule:oklch(.36 .035 240);
  --rule:oklch(.89 .007 235);--rule-2:oklch(.80 .01 235);
  --ink:oklch(.21 .02 245);--ink-2:oklch(.36 .02 245);--ink-3:oklch(.44 .018 245);--ink-4:oklch(.53 .014 245);
  --sel:oklch(.925 .02 238);--hover:oklch(.955 .008 238);--focus:oklch(.50 .14 245);--selection:oklch(.50 .14 245/.25);
  --primary:oklch(.24 .025 245);--primary-ink:oklch(.98 .004 240);
  --you:oklch(.52 .16 50);--you-bg:oklch(.95 .04 60);--corral:oklch(.50 .16 278);--worker:oklch(.50 .10 215);
  --fail:oklch(.53 .19 27);--fail-bg:oklch(.95 .035 25);--ok:oklch(.50 .13 152);--ok-bg:oklch(.95 .035 152);
  --shade:oklch(.2 .02 240/.25);
}
*{box-sizing:border-box;margin:0;scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent}
html,body{height:100%}
body{font:13px/1.45 var(--font);background:oklch(.12 .015 238);color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow:hidden;display:grid;grid-template-rows:34px minmax(0,1fr)}
::selection{background:var(--selection)}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-radius:4px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0;resize:none;min-width:0}
a{color:inherit;text-decoration:none}
ul{list-style:none;padding:0}
h1,h2,h3{font-weight:650}
code,.mono{font-family:var(--mono);font-size:.93em}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dim{color:var(--ink-3)}.sp{flex:1}

/* the bar above the app belongs to this reference, not to the product */
#mock{display:flex;align-items:center;gap:14px;padding:0 12px;background:oklch(.12 .015 238);color:oklch(.78 .012 238);font-size:12px;border-bottom:1px solid oklch(.24 .02 238);white-space:nowrap;overflow:hidden}
#mock b{color:oklch(.94 .006 240)}
#mock>*{flex:none}
#mock>span:nth-child(2){flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid oklch(.32 .02 238);border-radius:6px;overflow:hidden}
.seg button{padding:2px 9px;height:22px}
.seg button[aria-pressed=true]{background:oklch(.30 .035 238);color:oklch(.97 .005 238);font-weight:650}
#mock .lnk{padding:2px 8px;border-radius:5px;border:1px solid oklch(.32 .02 238);height:22px}
#mock .lnk[aria-pressed=true]{background:oklch(.30 .035 238);color:oklch(.97 .005 238)}
.app .seg{border-color:var(--rule-2)}
.app .seg button[aria-pressed=true]{background:var(--primary);color:var(--primary-ink)}

#stage{min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.app{position:relative;width:100%;height:100%;display:grid;grid-template:36px minmax(0,1fr)/208px minmax(0,1fr);background:var(--bg);overflow:hidden}

/* shell */
.titlebar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 12px 0 14px;background:var(--shell);color:var(--shell-ink);border-bottom:1px solid var(--shell-rule);font-size:12px;white-space:nowrap;min-width:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:13px}
.brand .mk{color:inherit}
.titlebar .path{color:var(--shell-ink-2);font-family:var(--mono)}
.hl{display:flex;align-items:center;gap:6px}
.hl i{width:6px;height:6px;border-radius:50%;background:oklch(.78 .13 152)}
.sample{border:1px solid oklch(.84 .13 92/.55);color:oklch(.84 .13 92);border-radius:4px;padding:1px 6px;font-family:var(--mono);font-size:11px}
.side{background:var(--shell);color:var(--shell-ink);display:flex;flex-direction:column;gap:2px;padding:10px 8px;border-right:1px solid var(--shell-rule);min-height:0;overflow:auto}
.scope{display:flex;align-items:center;gap:9px;height:34px;padding:0 9px;border:1px solid var(--shell-rule);border-radius:7px;margin-bottom:10px;font-weight:650;color:oklch(.97 .005 238)}
.scope:hover{background:oklch(1 0 0/.05)}
.scope small{display:block;font-weight:400;font-size:11px;color:var(--shell-ink-2);line-height:1.1}
.scope .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.nav{display:flex;align-items:center;gap:10px;height:30px;padding:0 9px;border-radius:6px;color:var(--shell-ink-2);font-weight:500}
.nav:hover{background:oklch(1 0 0/.05);color:var(--shell-ink)}
.nav.on{background:var(--shell-sel);color:oklch(.97 .005 238);font-weight:650}
.nav.sub{height:26px;padding-left:35px;font-size:12.5px}
.nav .cnt{margin-left:auto;font:700 11.5px var(--mono);color:oklch(.76 .15 58)}
.nav kbd{font:11px var(--mono);color:var(--shell-ink-2);width:26px;text-align:right;opacity:.75}
.nav .lbl+kbd{margin-left:auto}
.side hr{border:0;border-top:1px solid var(--shell-rule);margin:8px 6px}
.dev{padding:8px 9px 2px;font-size:11.5px;color:var(--shell-ink-2)}
.tabbar{display:none}
.tfold{display:inline-flex;color:var(--shell-ink-2);border-radius:5px;padding:3px}
.tfold:hover{color:var(--shell-ink);background:oklch(1 0 0/.06)}

/* page frame */
#view{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
.scroll{flex:1;min-height:0;overflow:auto}
.phead{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:12px 20px 11px;border-bottom:1px solid var(--rule);min-height:52px}
.phead h1{font-size:17px;letter-spacing:-.01em}
.phead .say{color:var(--ink-2)}
.phead .say b{font-weight:650;color:var(--ink)}
.phead .say .you{color:var(--you);font-weight:650}
.facts{padding:8px 20px;border-bottom:1px solid var(--rule);color:var(--ink-3);font-size:12.5px;display:flex;gap:4px 18px;flex-wrap:wrap}
.facts b{color:var(--ink-2);font-weight:500}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--ink-3);font-size:12.5px;height:24px;padding-right:6px;border-radius:5px}
.back:hover{color:var(--ink)}
.field{display:flex;align-items:center;gap:8px;height:28px;padding:0 9px;border:1px solid var(--rule-2);border-radius:6px;background:var(--sunk);min-width:220px}
.field input{flex:1}
.field:focus-within{border-color:var(--focus)}
.subnav{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--rule-2);font-weight:600;font-size:12.5px;white-space:nowrap;background:var(--surface)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.pri:hover{filter:brightness(.92)}
.btn.warn{border-color:var(--fail);color:var(--fail)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-3);padding:0 6px}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.lg{height:30px;padding:0 14px;font-size:13px}
.btn small{font-weight:400;opacity:.75}

/* status marks: colour carries state only, and every state also has its word */
.mk{width:12px;height:12px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5}
.s-blocked{color:var(--you)}.s-running,.s-working{color:var(--worker)}.s-review{color:var(--corral)}
.s-done{color:var(--ok)}.s-ready{color:var(--ink)}.s-backlog,.s-idea,.s-idle,.s-dropped,.s-gone{color:var(--ink-4)}
.st{display:inline-flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}

/* the one row anatomy: status, id, title, what is happening, then facts in aligned columns, age,
   next step. The page sets the columns (--cols) from the width it has. */
.sec{display:flex;align-items:center;gap:8px;padding:14px 20px 6px;font-weight:650;font-size:12.5px}
.sec .n{font:11.5px var(--mono);color:var(--ink-3);font-weight:400}
.sec .why{font-weight:400;color:var(--ink-3)}
.sec.fold{cursor:pointer;color:var(--ink-3)}
.sec.fold:hover{color:var(--ink)}
.row,.rhead{display:grid;grid-template-columns:var(--cols);align-items:center;gap:0 10px;padding:0 20px}
.row{min-height:32px;border-top:1px solid var(--rule);cursor:pointer}
.rhead{position:sticky;top:0;z-index:2;height:25px;background:var(--bg);border-bottom:1px solid var(--rule);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-4);font-weight:650;white-space:nowrap}
.rhead .num,.row .num{text-align:right}
.row .num{font:11.5px var(--mono);color:var(--ink-2)}
.sgh,.sg{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;justify-items:center}
.sgh i{font-style:normal;font-size:9.5px;letter-spacing:0}
.sg .mk{width:11px;height:11px;cursor:help}
.p-ok{color:var(--ok)}.p-now{color:var(--corral)}.p-run{color:var(--worker)}.p-fail{color:var(--fail)}.p-you{color:var(--you)}.p-wait{color:var(--ink-4)}.p-none{color:var(--rule-2)}
.row.sel,.row.sel:hover{background:var(--sel);box-shadow:inset 2px 0 0 var(--focus)}
.rows.grouped .st span{display:none}
.rows>.row:last-child,.rows>.inplace:last-child{border-bottom:1px solid var(--rule)}
.row:hover{background:var(--hover)}
.row.child{background:var(--sunk)}
.row.child .ti{padding-left:16px}
.row.quiet .ti,.row.quiet .id{color:var(--ink-3)}
.row .id{font:12px var(--mono);color:var(--ink-2);white-space:nowrap}
.row .ti{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ti .tag{font:400 11.5px var(--mono);color:var(--ink-3);margin-left:8px}
.row .ti .tag.pri{color:var(--you);font-weight:700}
.row .ph,.row .c5{color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.row .ph .bad{color:var(--fail)}.row .ph .good{color:var(--ok)}
.row .age{font:11.5px var(--mono);color:var(--ink-3);text-align:right}
.row .act{display:flex;justify-content:flex-end;gap:2px}
.row .more{opacity:0}
.row:hover .more,.row .more:focus-visible{opacity:1}
.caret{display:inline-flex;width:16px;height:16px;margin:0 4px 0 -4px;vertical-align:-3px;justify-content:center;align-items:center;color:var(--ink-3);border-radius:4px}
.caret:hover{background:var(--surface-2);color:var(--ink)}
.caret svg{width:12px;height:12px}
.inplace{margin:0 20px 0 178px;padding:8px 0 12px 14px;border-left:2px solid var(--you);display:flex;flex-direction:column;gap:8px;max-width:760px}
.well{background:var(--sunk);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;font:12px/1.5 var(--mono);color:var(--ink-2);white-space:pre-wrap;overflow:auto;max-height:220px}
.reply{display:flex;gap:8px;align-items:flex-end}
.reply textarea{flex:1;min-height:30px;padding:5px 9px;border:1px solid var(--rule-2);border-radius:6px;background:var(--sunk)}
.reply textarea:focus{border-color:var(--focus)}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{display:flex;gap:10px;align-items:baseline;padding:6px 10px;border:1px solid var(--rule-2);border-radius:6px;background:var(--surface)}
.opt:hover{background:var(--surface-2);border-color:var(--ink-3)}
.opt b{font:600 12px var(--mono);color:var(--ink-3)}
.opt span{font-weight:600}.opt small{color:var(--ink-3);font-size:12.5px}
.empty{padding:28px 20px;color:var(--ink-3)}

/* desktop: an inspector beside every list, and overview numbers under the page head */
.withinsp{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px}
.listcol{display:flex;flex-direction:column;min-width:0;min-height:0}
.insp{border-left:1px solid var(--rule);background:var(--surface);overflow:auto;min-height:0;font-size:12.5px}
.ih{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.ih .l1{display:flex;align-items:center;gap:8px}
.ih h2{font-size:14px;line-height:1.35}
.ih .id{font:12px var(--mono);color:var(--ink-2)}
.decide.flat,.pin.flat{margin:0;border-radius:0;border-width:1px 0 1px 3px;max-width:none;background:var(--bg);padding:10px 14px}
.pin.flat{border-width:1px 0;background:var(--you-bg)}
.insp .well{max-height:150px}
.insp .md{font-size:12.5px}
.fgrid{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:3px 10px}
.fgrid span{color:var(--ink-3)}
.fgrid b{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:flex;flex-direction:column;gap:6px}
.mini .you-b{padding:5px 9px}
.stats{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:7px 20px;border-bottom:1px solid var(--rule);font-size:12px;color:var(--ink-3)}
.tok{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tok b{font:600 12px var(--mono);color:var(--ink)}
a.tok:hover{color:var(--ink)}
.sepv{width:1px;height:14px;background:var(--rule-2)}
.meter{display:inline-flex;gap:2px}
.meter i{width:5px;height:11px;border-radius:1px;background:var(--rule-2)}
.meter i.on{background:var(--worker)}

/* composer */
.composer{border-top:1px solid var(--rule);padding:10px 20px 12px;background:var(--bg)}
.cbox{border:1px solid var(--rule-2);border-radius:8px;background:var(--sunk);padding:8px 10px 6px;display:flex;flex-direction:column;gap:6px;max-width:980px}
.cbox:focus-within{border-color:var(--focus)}
.cbox textarea{min-height:22px;max-height:120px;width:100%}
.cbar{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border:1px solid var(--rule-2);border-radius:11px;font-size:12px;color:var(--ink-2)}

/* task and session pages */
.thead{padding:10px 20px 12px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.thead .l1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.thead h1{font-size:17px;flex:1;min-width:200px}
.thead .id{font:13px var(--mono);color:var(--ink-2)}
.meta{display:flex;gap:2px 16px;flex-wrap:wrap;color:var(--ink-3);font-size:12.5px}
.meta b{font-weight:500;color:var(--ink-2)}
.meta a{text-decoration:underline dotted;text-underline-offset:3px}
.decide{margin:14px 20px 0;padding:12px 14px;border:1px solid var(--rule-2);border-left:3px solid var(--ink-3);border-radius:7px;background:var(--surface);display:flex;flex-direction:column;gap:10px;max-width:980px}
.decide.blocked{border-left-color:var(--you)}.decide.review{border-left-color:var(--corral)}.decide.running,.decide.working{border-left-color:var(--worker)}.decide.done{border-left-color:var(--ok)}
.decide .what{font-size:14px;font-weight:650}
.decide .how{color:var(--ink-2)}
.decide .how .good{color:var(--ok)}.decide .how .bad{color:var(--fail)}
.decide .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.onto{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);margin-left:6px}
.onto code{color:var(--ink)}
.tabs{display:flex;gap:2px;padding:10px 20px 0;border-bottom:1px solid var(--rule)}
.tab{padding:6px 12px 8px;color:var(--ink-3);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab .n{font:11.5px var(--mono);margin-left:5px;color:var(--ink-3)}
.ov{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0 28px;padding:16px 20px 28px;max-width:1240px}
.h{font-size:11.5px;font-weight:650;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px}
.blk{margin-bottom:20px}
.md{color:var(--ink-2);line-height:1.6;max-width:72ch}
.md h3{font-size:13px;color:var(--ink);margin:10px 0 2px}
.md li{padding-left:14px;position:relative}
.md li:before{content:"·";position:absolute;left:3px;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 10px;align-items:center;min-height:28px;border-top:1px solid var(--rule);font-size:12.5px;padding:3px 0}
a.kv:hover,button.kv:hover{background:var(--hover)}
.kv .k{color:var(--ink-2);white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.kv .v{color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv .t{font:11.5px var(--mono);color:var(--ink-3)}
.good{color:var(--ok)}.bad{color:var(--fail)}
.diffwrap{display:grid;grid-template-columns:270px minmax(0,1fr);flex:1;min-height:0}
.files{border-right:1px solid var(--rule);overflow:auto;padding:8px 0}
.file{display:flex;gap:8px;width:100%;padding:5px 14px 5px 20px;font:12px var(--mono);color:var(--ink-2)}
.file:hover{background:var(--hover)}.file.on{background:var(--sel);color:var(--ink)}
.file span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.file i{font-style:normal;color:var(--ok)}.file em{font-style:normal;color:var(--fail)}
.diff{overflow:auto;font:12px/1.55 var(--mono);padding:8px 0}
.diff div{padding:0 16px;white-space:pre}
.diff .hk{color:var(--corral);background:var(--sunk);padding-top:3px;padding-bottom:3px;margin:4px 0}
.diff .ad{background:var(--ok-bg)}.diff .rm{background:var(--fail-bg)}
.summary{padding:12px 20px;border-bottom:1px solid var(--rule);color:var(--ink-2);max-width:980px}
.ev{display:grid;grid-template-columns:96px 110px 70px minmax(0,1fr) 80px;gap:0 12px;min-height:30px;align-items:center;padding:0 20px;border-top:1px solid var(--rule);font-size:12.5px}
.ev .t,.ev .who{font:11.5px var(--mono);color:var(--ink-3)}
.ev .kd{font-weight:600}.ev .tx{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .who{text-align:right}
a.ev:hover{background:var(--hover)}

/* session page: the conversation, and one details panel (open on a wide screen, closed on a phone) */
.sbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.sbody.open{grid-template-columns:minmax(0,1fr) 350px}
.queue{margin:0 20px 8px;max-width:980px;font-size:12.5px}
.qrow{display:flex;gap:10px;align-items:center;min-height:28px;border-top:1px solid var(--rule)}
.qrow b{font:600 11.5px var(--mono);color:var(--ink-3)}
.qrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

const costOf = x => T[x.id]===x ? Object.values(SS).filter(s => s.task===x.id).reduce((a,s) => a + usd(s), 0) : usd(x);
const money = v => v ? "$" + v.toFixed(2) : "–";
/* Columns give way as the list narrows: profile first, then project; both stay in the inspector. */
function cols(kind){
  const w = listW(), prof = w >= (kind==="sess" ? 860 : 1040), proj = S.scope==="all" && w >= 1040;
  const tpl = kind==="tasks" ? `14px 58px minmax(140px,1.4fr) minmax(110px,1fr) 100px ${proj?"104px ":""}${prof?"92px ":""}50px 34px 150px`

    : `78px 62px minmax(140px,1.4fr) minmax(110px,1fr) ${proj?"104px ":""}${prof?"110px ":""}50px 34px 126px`;
  return {tpl, proj, prof};
}
function rhead(kind){
  const c = cols(kind), n = s => [s];

  return `<div class="rhead">${cells.filter(x => x!==false).map(x => Array.isArray(x) ? `<span class="num">${x[0]}</span>` : `<span>${x}</span>`).join("")}</div>`;

/* Where a task stands in run, gate, review and land, each with the words that say it. */
const PMK = {ok:MK.done, now:MK.running, run:MK.running, fail:MK.dropped, you:MK.blocked, wait:MK.backlog, none:'<circle cx="6" cy="6" r="1" fill="currentColor" stroke="none"/>'};
const pm = (k, tip) => `<svg class="mk p-${k}" viewBox="0 0 12 12">${tip?`<title>${tip}</title>`:""}${PMK[k]}</svg>`;
function pipeline(t){
  const s = t.status, g = t.gate, r = t.review, run = t.run, inRev = s==="review";
  const R = !run || ["idea","backlog","ready","dropped"].includes(s) ? ["none",""] : s==="running" ? ["now", `worker ${run.id} · ${run.doing||"starting"}`]
    : s==="blocked" && g?.result!=="fail" ? ["you", t.blocked.reason] : ["ok", `worker ${run.id} ended at done`];
  const G = !g ? [inRev?"wait":"none", inRev?"not started":""] : g.result==="pass" ? ["ok", `passed on ${g.sha}`] : g.result==="fail" ? ["fail", `failed on ${g.sha}`] : ["now", `running on ${g.sha}`];
  const V = !r ? [inRev?"wait":"none", inRev?"waits for the gate":""] : r.result==="pass" ? ["ok", `approved in round ${r.round} of 2`] : ["now", `round ${r.round} of 2, reviewer working`];
  const L = s==="done" ? ["ok", t.landed ? `landed ${t.landed} onto ${base(t)}` : "done"] : t.ready ? ["you", "ready, waits on your approve"] : inRev ? ["wait", "after gate and review"] : ["none",""];
  return [["Run",...R],["Gate",...G],["Review",...V],["Land",...L]];
}
function row(x, o={}){
  const isT = T[x.id]===x, kind = o.kind||"home", c = cols(kind), insp = inspOn(), page = route().page;
  const status = x.status, to = isT ? `task/${x.id}` : `session/${x.id}`;
  KEYS.add(x.id); if (!o.child) ROWS.push(x.id);
  const inlist = kind==="home" && !insp; // without an inspector, Home answers small things in the list
  let act = "";
  if (isT){
    const n = inlist && !x.small && (status==="blocked"||x.ready) ? {nav:to, label:"Open"} : nextStep(x);
    if (n && !(kind==="home" && status==="running")) act = n.nav ? `<a class="btn" href="#${n.nav}">${n.label}</a>` : `<button class="btn${status==="blocked"||x.ready?" pri":""}" data-a="op" data-op="${n.op}" data-id="${x.id}" ${n.arg?`data-arg="${n.arg}"`:""} ${n.force?"data-force=1":""}>${n.label}</button>`;
    if (inlist && x.small && status==="blocked") act = "";
    act += `<button class="btn ghost more" data-a="more" data-id="${x.id}" aria-label="More for ${x.id}">${ic("more")}</button>`;
  } else {
    if (status==="blocked" && !(inlist && x.small)) act = `<a class="btn${kind==="home"?"":" pri"}" href="#${to}">Open</a>`;
    if (status==="gone" && x.role!=="Worker" && !x.fresh) act = `<button class="btn" data-a="say" data-say="resumed ${x.id}">Resume</button>`;
    act += `<button class="btn ghost more" data-a="smore" data-id="${x.id}" aria-label="More for ${x.id}">${ic("more")}</button>`;
  }
  const pri = isT && x.pri!=="P2" ? `<span class="tag pri">${x.pri}</span>` : "";
  const title = isT ? h(x.title) + pri + (x.parent && !o.child ? `<span class="tag">in ${x.parent}</span>` : "") : `${h(x.name)}<span class="tag">${x.role}</span>`;
  const what = isT ? phrase(x) : h(x.doing||"") + (x.quiet && status==="working" ? ` · quiet ${x.quiet}` : "");
  const stages = kind==="tasks" ? `<span class="sg x">${pipeline(x).map((p,i) => pm(p[1]==="now" && i===0 ? "run" : p[1], `${p[0]}: ${h(p[2]||"not started")}`)).join("")}</span>` : "";
  const proj = c.proj && kind!=="sess" ? `<span class="c5 x">${h(x.project||"–")}</span>` : "";
  const prof = c.prof ? `<span class="c5 x">${h(isT ? (x.run?.profile || PROJECTS[x.project]?.profile || "") : (x.model||"").split("/").pop())}</span>` : "";
  const ctx = kind==="sess" ? `<span class="num x">${status==="gone" ? "–" : x.ctx+"%"}</span>` : "";
  const car = x.children && kind==="tasks" ? `<button class="caret" data-a="unfold" data-id="${x.id}" aria-label="Show children">${ic(S.unfold[x.id]?"down":"right")}</button>` : "";
  return `<div class="row${o.child?" child":""}${o.quiet?" quiet":""}${insp && S.sel[page]===x.id?" sel":""}" data-a="nav" data-to="${to}" data-key="${x.id}">
    ${st(status)}<span class="id">${x.id}</span><span class="ti">${car}${title}</span>
    <span class="ph" data-st="${cap(status)}" data-id="${x.id}">${what}</span>${stages}${proj}${prof}${ctx}<span class="num x">${money(costOf(x))}</span><span class="age">${x.at&&o.quiet?x.at:x.age}</span><span class="act">${act}</span></div>`;
}
function replyBox(id, ph="Reply to the worker…"){

}
function options(s){

  ${s.question.exit ? "" : `<div class="reply"><textarea rows="1" placeholder="Or write your own answer…" data-draft="${s.id}" aria-label="Answer ${s.id}">${h(S.drafts[s.id]||"")}</textarea><button class="btn" data-a="answer" data-id="${s.id}" data-i="-1">Send</button></div>`}`;
}
function inplace(x){
  if (T[x.id]===x) return `<div class="inplace"><div class="well">${h(x.blocked.detail)}</div>${replyBox(x.id)}</div>`;

function composer(){
  return `<div class="composer"><div class="cbox"><textarea rows="1" id="ask" data-draft="ask" placeholder="Ask, file an idea, or tell Corral what to do…" aria-label="Message to the assistant">${h(S.drafts.ask||"")}</textarea>

/* The decision of a task: what is happening, the evidence, and the next step as buttons. */
function decision(t, cls=""){
  const id = t.id, n = nextStep(t), p = PROJECTS[t.project];
  const btn = (x, pri) => x.nav ? `<a class="btn lg${pri?" pri":""}" href="#${x.nav}">${x.label}</a>` : `<button class="btn lg${pri?" pri":""}${x.force?" warn":""}" data-a="op" data-op="${x.op}" data-id="${id}" ${x.arg?`data-arg="${x.arg}"`:""} ${x.force?"data-force=1":""}>${x.label||opLabel(x)}${x.force?` <small>skips ${SKIPS[x.op]}</small>`:""}</button>`;
  const live = Object.values(SS).find(s => s.task===id && s.status!=="gone");
  let what, how = "", btns = "", extra = "";
  if (t.status==="blocked"){
    what = `Blocked: ${h(t.blocked.reason)}`;
    extra = t.blocked.detail ? `<div class="well">${h(t.blocked.detail)}</div>` : "";
    if (t.blocked.next[0].op==="reply"){ extra += replyBox(id); btns = t.blocked.next.slice(1).map(x => btn(x)).join(""); }
    else btns = t.blocked.next.map((x,i) => btn(x, i===0)).join("");
  } else if (t.status==="review"){
    what = t.ready ? `Ready to land onto ${base(t)}` : `In review: nothing for you yet`;
    how = `<div class="how">${phrase(t, true)}${t.gate?` · commit <code>${t.gate.sha}</code>`:""}</div>`;
    btns = t.ready ? btn({op:"approve",label:"Approve"},true) + btn({op:"changes",label:"Changes"}) + `<span class="onto">onto <code>${base(t)}</code> <button class="btn ghost" data-a="say" data-say="onto: pick another branch">change</button></span>` : live ? `<a class="btn lg" href="#session/${live.id}">Open session</a>` : "";
  } else if (t.status==="running"){
    what = t.run ? `Running: ${h(t.run.doing||"starting")}` : `Running, with no worker session`;
    how = t.run ? `<div class="how">worker ${t.run.id} · profile ${t.run.profile}${t.run.quiet?` · quiet ${t.run.quiet}`:""}</div>` : `<div class="how">Moved here by force. Move it again from More.</div>`;
    btns = n ? btn(n,true) : "";
  } else if (t.status==="done"){ what = `Done`; how = `<div class="how">${phrase(t)} · ${t.at||""}</div>`;
  } else if (t.status==="dropped"){ what = `Dropped`; btns = btn({op:"reopen",label:"Reopen"});
  } else { what = t.status==="ready" ? `Ready to dispatch` : cap(t.status); how = `<div class="how">${phrase(t) || (t.status==="ready" ? `dependencies done · ${slots()} of ${LIMIT} slots used · resolves to profile ${p.profile}` : "Not started.")}</div>`; btns = btn(n,true); }
  return `<div class="decide ${t.status} ${cls}"><div class="what">${what}</div>${how}${extra}${btns?`<div class="btns">${btns}</div>`:""}</div>`;
}
const dsec = (name, body) => `<div class="dsec"><div class="h">${name}</div>${body}</div>`;
const mdOf = t => { const b = t.body || {goal:t.title+".", accept:["Stated in the task body."], notes:""}; return `<div class="md"><h3>Goal</h3><p>${h(b.goal)}</p><h3>Acceptance</h3><ul>${b.accept.map(a => `<li>${h(a)}</li>`).join("")}</ul>${b.notes?`<h3>Notes</h3><p>${h(b.notes)}</p>`:""}</div>`; };
const runRows = id => Object.values(SS).filter(s => s.task===id).map(s => `<a class="kv" href="#session/${s.id}"><span class="k">${mark(s.status)}${s.id.split("/")[1]} · ${s.role}</span><span class="v">${h(s.doing||"")}</span><span class="t">${s.cost}</span></a>`).join("") || `<div class="kv"><span class="v">No run yet.</span></div>`;
const pipeRows = t => pipeline(t).map(p => `<div class="kv"><span class="k">${pm(p[1]==="now" && p[0]==="Run" ? "run" : p[1])}${p[0]}</span><span class="v">${h(p[2]||"not started")}</span><span></span></div>`).join("");
const logOf = s => s.log || [["you", s.task ? `Prompt for ${s.task}: ${T[s.task]?.title||""}` : "…"],["tool","read","AGENTS.md","312 lines","0.1s"],["say",h(s.doing||"")]];
const logItem = x => x[0]==="you" ? `<div class="you-b"><small>you</small>${h(x[1])}</div>` : x[0]==="think" ? `<div class="think">${h(x[1])}</div>` :
  x[0]==="tool" ? `<div class="tool">${mark(x[3]==="running"?"working":"done")}<b>${x[1]}</b><span>${h(x[2])} · ${x[3]}</span><u>${x[4]}</u></div>` :
  x[0]==="agents" ? `<div class="card"><div class="hd">task · ${x[1].length} agents</div>${x[1].map(a => `<div class="kv"><span class="k mono">${a[0]}</span><span class="v" style="color:var(--ink-2)">${a[1]}</span><span class="t">${a[2]} · ${a[3]}</span></div>`).join("")}</div>` : `<div class="say">${x[1]}</div>`;
/* What a session's host serves besides its conversation; the Details panel and the inspector share it. */
function detailSections(s){

    + dsec("Usage", `<div class="kv"><span class="k">cost</span><span class="v"></span><span class="t">${s.cost}</span></div><div class="dim" style="font-size:12px;margin-top:4px">${s.usage||"tokens not recorded"}</div>`)

/* The selected row, in full, beside the list: decide without leaving the list. */
function inspector(id){
  const t = T[id], s = SS[id], x = t||s;
  if (!x) return `<aside class="insp"><div class="empty">Select a row to inspect it here.</div></aside>`;
  const fact = (k, v) => v ? `<span>${k}</span><b title="${h(v)}">${h(v)}</b>` : "";
  const head = `<div class="ih"><div class="l1">${st(x.status)}<span class="id">${x.id}</span>${s?`<span class="dim">${s.role}</span>`:""}<span class="sp"></span><a class="btn" href="#${t?"task":"session"}/${id}">Open page</a><button class="btn ghost" data-a="${t?"more":"smore"}" data-id="${id}" aria-label="More for ${id}">${ic("more")}</button></div><h2>${h(t?t.title:s.name)}</h2></div>`;
  if (t){
    const evs = EVENTS.filter(e => e[2]===id).slice(0,5), files = t.files||[], cost = costOf(t);
    return `<aside class="insp">${head}${decision(t, "flat")}
      ${dsec("Facts", `<div class="fgrid">${fact("project",t.project)}${fact("priority",t.pri)}${fact("kind",t.kind)}${fact("size",t.size)}${fact("base",base(t))}${fact("profile", t.run?.profile || PROJECTS[t.project].profile+" (resolved)")}${fact("round", t.run ? `${t.round||0} of 2` : "")}${fact("cost", cost ? money(cost) : "")}${fact("in",t.parent)}${fact("after",t.deps.join(", "))}</div>`)}
      ${dsec("Pipeline", pipeRows(t))}
      ${t.children ? dsec("Children", t.children.map(c => `<a class="kv" href="#task/${c}"><span class="k">${mark(T[c].status)}<span class="mono">${c}</span></span><span class="v" style="color:var(--ink-2)">${h(T[c].title)}</span><span class="t">${cap(T[c].status)}</span></a>`).join("")) : ""}
      ${files.length ? dsec(`Changes · ${files.length} files`, files.map(f => `<a class="kv" href="#task/${id}/changes"><span class="k mono" style="font-size:11.5px">${h(f.p.split("/").slice(-2).join("/"))}</span><span class="v"></span><span class="t"><span class="good">+${f.a}</span> <span class="bad">−${f.r}</span></span></a>`).join("")) : ""}
      ${dsec("Description", mdOf(t))}
      ${dsec("Runs", runRows(id))}
      ${dsec("History", evs.map(e => `<div class="kv"><span class="k mono">${e[0]}</span><span class="v"><b style="color:var(--ink-2)">${e[1]}</b> ${h(e[3])}</span><span class="t">${e[4]}</span></div>`).join("") || `<span class="dim">No events in this sample.</span>`)}</aside>`;
  }
  return `<aside class="insp">${head}
    ${s.question ? `<div class="pin flat"><div class="q">${h(s.question.text)}</div>${options(s)}</div>` : `<div class="decide ${s.status} flat"><div class="what">${cap(s.status)}${s.doing?": "+h(s.doing):""}</div></div>`}
    ${dsec("Facts", `<div class="fgrid">${fact("project",s.project)}${fact("branch",s.branch)}${fact("model",s.model.split("/").pop())}${fact("effort",s.effort)}${fact("cost",s.cost)}${fact("context",s.status==="gone"?"":s.ctx+"%")}${fact("quiet",s.status==="working"?s.quiet:"")}${fact("age",s.age)}</div>`)}
    ${dsec("Latest", `<div class="mini">${logOf(s).slice(-4).map(logItem).join("")}</div>`)}${detailSections(s)}</aside>`;
}
/* Overview numbers: where every task stands, the slots, the sessions, today's cost, what changed. */
function stats(){
  const all = tasks(), ss = sessions(), by = s => all.filter(t => t.status===s).length, sby = s => ss.filter(x => x.status===s).length;
  const today = all.reduce((a,t) => a + costOf(t), 0) + ss.filter(s => !s.task).reduce((a,s) => a + usd(s), 0);

    <span class="sepv"></span><a class="tok" href="#sessions"><span>sessions</span>${["blocked","working","idle"].map(k => `${mark(k)}<b title="${sby(k)} sessions ${cap(k)}">${sby(k)}</b>`).join("")}</a>
    <span class="sepv"></span><a class="tok" href="#activity/usage"><span>today</span><b>${money(today)}</b></a>
    <span class="sepv"></span><a class="tok" href="#activity/feed"><span>since 09:16</span><b>${since("landed")}</b>landed <b>${since("dropped")}</b>dropped <b>${since("created")}</b>created <b>${since("forced")}</b>forced</a></div>`;

const inspBtn = () => isPhone() ? "" : `<button class="btn" data-a="insp" aria-pressed="${S.insp}" title="Show or hide the inspector (i)">${ic("panel")}Inspector</button>`;
/* A list page: the table, and beside it the inspector of the selected row when there is room. */

function vHome(){
  const need = [...tasks(t => t.status==="blocked" || t.ready), ...sessions(s => s.status==="blocked" && !s.task)];
  const work = [...tasks(t => t.status==="running" || (t.status==="review" && !t.ready)), ...sessions(s => s.status==="working" && !s.task)];
  const fin = [...tasks(t => t.fresh), ...sessions(s => s.fresh)];
  const p = PROJECTS[S.scope], insp = inspOn();
  const say = [need.length?`<span class="you">${need.length} need you</span>`:"nothing needs you", `${work.length} working`, `${fin.length} finished since 09:16`].join(" · ");
  const sec = (name, list, o, why) => `<div class="sec">${name} <span class="n">${list.length}</span><span class="why hidep">${why}</span></div><div class="rows">${list.map(x => row(x,o) + (!insp && x.small && x.status==="blocked" ? inplace(x) : "")).join("") || `<div class="empty">Nothing here.</div>`}</div>`;
  return `<div class="phead"><h1>${S.scope==="all"?"Home":h(S.scope)}</h1><span class="say">${say}</span><span class="sp"></span>${inspBtn()}</div>
  ${p ? `<div class="facts"><span>base <b>${p.base}</b></span><span>gate <b class="mono">${h(p.gate)}</b></span><span>reviewer <b>${p.reviewer}</b></span><span>profile <b>${p.profile}</b></span><span>auto dispatch <b>off</b></span><span>auto land <b>off</b></span><a href="#settings" class="dim">Edit in Settings</a></div>` : ""}
  ${stats()}${listPage("home", "home", sec("Needs you", need, {}, "Blocked, or ready to land") + sec("Working", work, {}, "") + sec("Just finished", fin, {quiet:true}, "since your last visit at 09:16"), composer())}`;
}
function vTasks(){
  const f = (S.drafts.filter||"").toLowerCase();
  const hit = t => !f || (t.id+" "+t.title+" "+t.project).toLowerCase().includes(f);
  let out = "";

    else if (m.kind==="session") items = `<div class="mh">${m.id}</div>` + [["Cancel turn","stop the current turn"],["Pause","hold automated input"],["Resume",""],["Rewind…","to an earlier turn"],["Stop","end the host"],["Relaunch",""]].map(x => `<button class="mi" data-a="say" data-say="session.${x[0].toLowerCase().replace(/\W+/g,"_")} ${m.id}">${x[0]}<small>${x[1]}</small></button>`).join("") + (SS[m.id]?.task ? `<hr><a class="mi" href="#task/${SS[m.id].task}">Open task ${SS[m.id].task}</a>` : "");
    else { const n = nextStep(T[m.id]); items = `<div class="mh">${m.id} · every operation, the engine decides</div>` + OPS.map(([op,hint]) => `<button class="mi${n&&n.op===op?" next":""}" data-a="menuop" data-op="${op}" data-id="${m.id}">${cap(op)}<small>${hint}</small></button>`).join(""); }

      body = `<h2>${land?"Land":cap(s.op)}${s.o.force?" anyway":""} ${s.id}?</h2><p>${txt}</p>${s.o.force?`<p class="skips">Skips ${SKIPS[s.op]}.</p>`:""}<div class="cmd">${land?`build.exit ${s.id} land`:cli(s.op,s.id,(s.o.arg?" "+s.o.arg:"")+(s.o.force?" --force":""))}</div><div class="foot"><button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="sure" id="btn-confirm">${land?"Land":cap(s.op)}${s.o.force?" anyway":""}</button></div><p class="skips">Asked once, on this device.</p>`;
    } else if (s.kind==="ask"){
      body = `<h2>Ask</h2><textarea id="ask" data-draft="ask" placeholder="Ask, file an idea, or tell Corral what to do…" aria-label="Message to the assistant">${h(S.drafts.ask||"")}</textarea><div class="foot"><span class="pill">${ic("folder")}${S.scope==="all"?"all projects":h(S.scope)}</span><span class="sp"></span><button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="ask">Send</button></div>`;
    } else if (s.kind==="form"){
      const t = T[s.id], f = s.f;
      const segs = (k, list) => `<div class="segs">${list.map(v => `<button aria-pressed="${f[k]===v}" data-a="fset" data-k="${k}" data-v="${v}">${k==="to"?cap(v):v}${k==="profile"&&t&&v===PROJECTS[t.project].profile?" · default":""}</button>`).join("")}</div>`;
      const txt = (ph) => `<textarea data-form="text" placeholder="${ph}" aria-label="${ph}">${h(f.text||"")}</textarea>`;
      const b = {new:`<div><label>Title</label><input class="txt" data-form="text" value="${h(f.text||"")}" aria-label="Title"></div><div><label>Status</label>${segs("to",["idea","backlog","ready"])}</div><div><label>Project</label>${segs("project",Object.keys(PROJECTS))}</div>`,
        move:`<div><label>Status</label>${segs("to",STATUSES)}</div>`, dispatch:`<div><label>Profile</label>${segs("profile",PROFILES)}</div><div><label>Base</label><input class="txt" value="${t?base(t):"main"}" aria-label="Base"></div>`,
        retry:`<div><label>Profile</label>${segs("profile",PROFILES)}</div><div><label>Start</label>${segs("fresh",["same branch","fresh from base"])}</div><div><label>Note</label>${txt("What should change this time?")}</div>`,
        verdict:`<div><label>Verdict</label>${segs("verdict",["approve","changes"])}</div><div><label>Notes</label>${txt("Notes for the worker")}</div>`}[s.op] || `<div><label>${cap(s.op)}</label>${txt({reply:"Text for the worker",changes:"What to change",comment:"Note appended to the task",edit:"New title"}[s.op]||"Text")}</div>`;
      body = `<h2>${s.op==="new"?"New task":cap(s.op)+" "+s.id}</h2>${b}<div class="foot"><button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="fsend" id="btn-form">${s.op==="new"?"Create":cap(s.op)}</button></div>`;
    }

  }
  if (S.pal!==null){
    const f = S.pal.toLowerCase();
    const all = [["home","Home"],["tasks","Tasks"],["sessions","Sessions"],["activity/feed","Activity › Feed"],["activity/timeline","Activity › Timeline"],["activity/usage","Activity › Usage"],["activity/artifacts","Activity › Artifacts"],["settings","Settings"],
      ...Object.values(T).map(t => [`task/${t.id}`, `${t.id}  ${t.title}`, cap(t.status)]), ...Object.values(SS).map(s => [`session/${s.id}`, `${s.id}  ${s.name}`, s.role])].filter(x => !f || x[1].toLowerCase().includes(f)).slice(0,9);
    o += `<div class="shade pal" data-a="close"><div class="sheet" data-a="noop"><input id="pal" placeholder="Go to a page, task or session…" value="${h(S.pal)}" aria-label="Go to">${all.map((x,i) => `<a class="mi${i===0?" on":""}" href="#${x[0]}" data-a="close">${h(x[1])}<small>${x[2]||"page"}</small></a>`).join("") || `<div class="empty">Nothing matches.</div>`}</div></div>`;
  }

}
function render(keep){
  const r = route(), app = document.getElementById("app");
  const focus = document.activeElement?.dataset?.draft, at = document.activeElement?.selectionStart, sc = app.querySelector(".scroll,.log")?.scrollTop;
  document.documentElement.className = "t-"+S.theme;
  app.className = "app" + (isPhone() ? " phone" : S.fold ? " fold" : "");
  const build = () => { ROWS = []; KEYS = new Set(); return r.page==="tasks" ? vTasks() : r.page==="task" ? vTask(r.rest[0], r.rest[1]) : r.page==="sessions" ? vSessions() : r.page==="session" ? vSession(r.rest.join("/")) : r.page==="activity" ? vActivity(r.rest[0]) : r.page==="settings" ? vSettings() : vHome(); };
  let view = build();
  if (LISTS.has(r.page) && inspOn() && !KEYS.has(S.sel[r.page])){ S.sel[r.page] = ROWS[0]; view = build(); } // the inspector always has a row
  app.innerHTML = shell(view) + overlays();
  document.getElementById("mock").innerHTML = `<b>Corral app redesign</b><span>reference · sample data</span><span class="sp"></span>
    <span class="seg"><button data-a="frame" data-id="desktop" aria-pressed="${S.frame==="desktop"}">Desktop</button><button data-a="frame" data-id="phone" aria-pressed="${S.frame==="phone"}">Phone</button></span>
    <span class="seg"><button data-a="theme" data-id="dark" aria-pressed="${S.theme==="dark"}">Dark</button><button data-a="theme" data-id="light" aria-pressed="${S.theme==="light"}">Light</button></span>
    <button class="lnk" data-a="notes" aria-pressed="${S.notes}">Design notes</button>`;
  document.getElementById("notes").hidden = !S.notes;
  const again = app.querySelector(focus ? `[data-draft="${focus}"]` : S.sheet?.kind==="ask" ? "#ask" : S.sheet?.kind==="form" ? "[data-form]" : null);
  if (again && (focus || !keep || !app.contains(document.activeElement))){ again.focus(); try { again.setSelectionRange(at ?? again.value.length, at ?? again.value.length); } catch(e){} }
  if (keep && sc){ const el = app.querySelector(".scroll,.log"); if (el) el.scrollTop = sc; }
  const lg = app.querySelector(".log"); if (lg && !keep) lg.scrollTop = lg.scrollHeight;
  if (S.focusDraft){ app.querySelector(`[data-draft="${S.focusDraft}"]`)?.focus(); S.focusDraft = null; }
  if (S.reveal){ app.querySelector(".row.sel")?.scrollIntoView({block:"nearest"}); S.reveal = false; }
  const pal = document.getElementById("pal"); if (pal){ pal.focus(); pal.setSelectionRange(pal.value.length, pal.value.length); }
}
function openMenu(el, kind, id){
  const a = document.getElementById("app").getBoundingClientRect(), b = el.getBoundingClientRect();
  const w = 270, hgt = kind==="task" ? 470 : 220;
  S.menu = {kind, id, x:Math.max(8, Math.min(b.left - a.left, a.width - w - 8)), y:Math.max(8, Math.min(b.bottom - a.top + 4, a.height - hgt - 8))};
}
const NEEDS_TEXT = new Set(["reply","changes","comment","edit","verdict","retry","move"]);
function openForm(op, id){ const t = T[id]; S.menu = null; S.sheet = {kind:"form", op, id, f:{to:op==="new"?"backlog":"ready", project:S.scope==="all"?"corral":S.scope, profile:t?PROJECTS[t.project].profile:"pi-terra", fresh:"same branch", verdict:"approve", text:op==="edit"&&t?t.title:""}}; }

const A = {
  nav(el, e){ if (e.target.closest("button,a,textarea,input")) return true;
    const twice = A.nav.key===el.dataset.key && e.timeStamp - A.nav.at < 450; A.nav.key = el.dataset.key; A.nav.at = e.timeStamp;
    if (inspOn() && LISTS.has(route().page) && !twice){ S.sel[route().page] = el.dataset.key; return; } // select; Enter or a second click opens the page
    location.hash = el.dataset.to; return true; },
  noop(){ return true; },
  op(el){ const d = el.dataset, page = route().page;
    if (d.op==="reply" && inspOn() && LISTS.has(page) && T[d.id]?.blocked?.next[0].op==="reply" && !el.closest(".sheet")){ S.sel[page] = d.id; S.focusDraft = d.id; return; }
    if (NEEDS_TEXT.has(d.op) && !d.arg && !d.force){ openForm(d.op, d.id); return; } apply(d.op, d.id, {arg:d.arg, force:!!d.force, sure:!!d.sure}); },
  menuop(el){ const d = el.dataset; if (NEEDS_TEXT.has(d.op) || d.op==="dispatch") openForm(d.op, d.id); else apply(d.op, d.id); },
  more(el){ openMenu(el, "task", el.dataset.id); }, smore(el){ openMenu(el, "session", el.dataset.id); }, newmenu(el){ openMenu(el, "new"); }, scope(el){ openMenu(el, "scope"); },
  setscope(el){ S.scope = el.dataset.id; S.menu = null; },
  close(){ S.menu = null; S.sheet = null; S.pal = null; },
  sure(){ const s = S.sheet; if (s.op==="land"){ answer.sure = true; answer(s.id, s.o.i); } else apply(s.op, s.id, Object.assign({}, s.o, {sure:true})); },
  form(el){ openForm(el.dataset.op, el.dataset.id||""); },
  fset(el){ S.sheet.f[el.dataset.k] = el.dataset.v; },
  fsend(){ const s = S.sheet, f = s.f;
    if (s.op==="new"){ const id = "T-"+(963+Object.keys(T).length-24); task(id, f.to, f.project, f.text||"Untitled task", {age:"now"}); log("created", id, ""); S.sheet = null; toast(`corral new "${(f.text||"Untitled task").slice(0,30)}" -p ${f.project}`); return; }
    apply(s.op, s.id, {text:f.text, arg:s.op==="move"?f.to:s.op==="verdict"?f.verdict:undefined, profile:f.profile, fresh:s.op==="retry" && f.fresh!=="same branch"}); },
  send(el){ const id = el.dataset.id; apply("reply", id, {text:S.drafts[id]||"ok"}); S.drafts[id] = ""; },
  comment(el){ const id = el.dataset.id; apply("comment", id, {text:S.drafts["c-"+id]||"noted"}); S.drafts["c-"+id] = ""; },
  answer(el){ const id = el.dataset.id, i = +el.dataset.i; answer(id, i, i<0 ? (S.drafts[id]||"your answer") : ""); S.drafts[id] = ""; },
  ask(){ const text = (S.drafts.ask||"").trim(); if (!text) return; const s = SS["A-4"]; s.log = (s.log||[]).concat([["you",text],["think","Reading the board…"]]); Object.assign(s, {status:"working", doing:"answering", age:"now"}); S.drafts.ask = ""; S.sheet = null; location.hash = "session/A-4"; },
  ask2(){ S.menu = null; location.hash = "home"; setTimeout(() => document.getElementById("ask")?.focus(), 30); },
  msg(el){ const id = el.dataset.id, text = (S.drafts["m-"+id]||"").trim(); if (!text) return; SS[id].log = (SS[id].log||[]).concat([["you",text]]); S.drafts["m-"+id] = ""; toast(`sent to ${id}`); },
  details(){ S.details = !detailsOn(); }, insp(){ S.insp = !S.insp; }, fold(){ S.fold = !S.fold; },
  queue(el){ const id = el.dataset.id, text = (S.drafts["m-"+id]||"").trim(); if (!text) return; (SS[id].queue = SS[id].queue||[]).push(text); S.drafts["m-"+id] = ""; toast(`queued for ${id}`); },
  unqueue(el){ SS[el.dataset.id].queue.splice(+el.dataset.i, 1); },
  unfold(el){ S.unfold[el.dataset.id] = !S.unfold[el.dataset.id]; }, closed(el){ S.closed[el.dataset.id] = !S.closed[el.dataset.id]; },
  file(el){ S.file = +el.dataset.i; }, asub(el){ S.asub = el.dataset.id; }, say(el){ S.menu = null; toast(el.dataset.say); },
  frame(el){ S.frame = el.dataset.id; }, theme(el){ S.theme = el.dataset.id; }, notes(){ S.notes = !S.notes; }, pal(){ S.pal = ""; },
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;

document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName||"");
  if (e.key==="Escape"){ if (S.menu||S.sheet||S.pal!==null||S.notes){ A.close(); S.notes = false; render(true); } else if (typing) document.activeElement.blur(); else if (route().page==="task") location.hash = "tasks"; else if (route().page==="session") location.hash = "sessions"; return; }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); S.pal = ""; render(true); return; }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="b"){ e.preventDefault(); S.fold = !S.fold; render(true); return; }
  if (e.key==="Enter" && !e.shiftKey && typing){
    const d = document.activeElement.dataset.draft, el = document.activeElement;
    if (el.id==="pal"){ const first = document.querySelector(".pal a.mi"); if (first){ S.pal = null; location.hash = first.getAttribute("href"); render(); } return; }
    if (d==="ask"){ e.preventDefault(); A.ask(); render(); } else if (d && d.startsWith("m-")){ e.preventDefault(); A.msg({dataset:{id:d.slice(2)}}); render(true); }
    return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || S.sheet || S.menu) return;
  const page = route().page;
  if (LISTS.has(page) && inspOn()){
    const d = {j:1, ArrowDown:1, k:-1, ArrowUp:-1}[e.key];
    if (d){ e.preventDefault(); S.sel[page] = ROWS[Math.max(0, Math.min(ROWS.length-1, ROWS.indexOf(S.sel[page])+d))]; S.reveal = true; render(true); return; }
    if (e.key==="Enter" && !/BUTTON|A/.test(document.activeElement?.tagName||"")){ const el = document.querySelector(".row.sel"); if (el) location.hash = el.dataset.to; return; }
  }
  if (e.key==="i" && LISTS.has(page)){ S.insp = !S.insp; render(true); return; }
  const go = {h:"home", t:"tasks", s:"sessions", a:"activity", ",":"settings"}[e.key];
  if (go){ location.hash = go; return; }
  if (e.key==="/"){ e.preventDefault(); if (route().page!=="home") S.sheet = {kind:"ask"}; render(true); document.getElementById("ask")?.focus(); }
});

document.getElementById("notes").innerHTML = `<h2>Design notes</h2><p>Brief: <code>docs/app-design/REDESIGN.md</code>, from the owner interviews of 2026-11-19. This file is a reference for the next step, not the app. Its data is a sample and its actions run on a small local engine.</p>
<h3>Principles</h3><ol><li><b>Attention first.</b> The first thing on screen is what waits on you.</li><li><b>Four places at rest.</b> Home, Tasks, Sessions, Activity; every other page has exactly one home under them.</li><li><b>One page per thing.</b> A task has one page, a session has one page; lists only open them.</li><li><b>One next step.</b> Each thing shows the one press that moves it; the rest is under More.</li><li><b>Decide where it is cheapest.</b> On a wide screen, in the inspector beside the list. On a phone, small answers in the list and large ones at the top of the page.</li><li><b>One scope.</b> The project in scope applies everywhere and is always visible.</li><li><b>The engine's words, the engine decides.</b> 8 statuses, CLI operation names, progress as a plain phrase; the app suggests but never predicts a refusal.</li><li><b>One list, one panel beside it.</b> No tabs inside pages (the task page excepted). A wide screen keeps the panel open: the inspector beside a list, Details beside a conversation. A phone shows one column and opens the rest.</li><li><b>Dense, and it uses the width.</b> The owner is technical: a row is a table row with a header (status, id, title, now, run, gate, review, land, project, profile, cost, age, next step), and columns give way only when there is no room. Colour only for state.</li><li><b>Same product on every device.</b> The phone has the same places, pages and actions, with less on screen at once.</li></ol>
<h3>Things to try</h3><ol><li>Any list: click a row, or walk with <code>j</code> <code>k</code>, and read it in the inspector; <code>Enter</code> or a second click opens its page; <code>i</code> hides the inspector and every column comes back; <code>Ctrl B</code> folds the sidebar.</li><li>Home: reply to T-887 and answer B-k3x9 from the inspector. On the phone frame the same answers sit in the list.</li><li>Tasks: press Dispatch on T-707 (refused: no slot) and on T-706 (refused: dependency); each refusal offers its forced form.</li><li>Open T-703: Approve asks once, then the task moves to Just finished. Its Changes tab holds the diff.</li><li>Open T-944: a Blocked task with a log; the engine's next steps are its buttons.</li><li>Any row's ⋯: all 15 operations, the next step marked.</li><li>The scope switcher at the top of the sidebar scopes every page. A scoped Home is the Project page.</li><li>Open B-p8d1: Details are open, a message can be queued or steer the turn, and the status line is under the composer. Open B-m2q7 to choose a build's exit.</li><li>Activity › Timeline ends with the burn-up.</li><li>Keys: <code>h t s a ,</code> places, <code>j k Enter i</code> lists, <code>/</code> composer, <code>Ctrl K</code> go to, <code>Ctrl B</code> sidebar, <code>Esc</code> back.</li></ol>
<h3>Where the nine destinations went</h3><table><tr><th>Today</th><th>Here</th></tr><tr><td>Now › Needs you</td><td>Home › Needs you</td></tr><tr><td>Now › Corral, Workers</td><td>Home › Working</td></tr><tr><td>Now › Waiting, Closed</td><td>Tasks</td></tr><tr><td>Changes</td><td>Activity › Feed</td></tr><tr><td>Plans</td><td>A task page with Children; a row in Tasks that unfolds</td></tr><tr><td>Agents</td><td>Sessions</td></tr><tr><td>Review</td><td>The task page: decision band and Changes tab</td></tr><tr><td>Timeline, Usage, Artifacts</td><td>Activity › Timeline, Usage, Artifacts</td></tr><tr><td>Project list, Project page, filter chips</td><td>The scope switcher; scoped Home</td></tr><tr><td>Ask drawer</td><td>The composer on Home; <code>/</code> elsewhere</td></tr><tr><td>Actions menu, Session menu</td><td>One next step plus More</td></tr></table>
<h3>Deep links</h3><p><code>#home #tasks #task/T-703/changes #sessions #session/B-k3x9 #activity/usage #settings</code>, with <code>?frame=phone&amp;theme=light&amp;scope=corral&amp;sel=T-703&amp;noinsp&amp;fold&amp;details&amp;notes&amp;demo=more|refusal|confirm|scope|form</code> before the hash.</p>`;
