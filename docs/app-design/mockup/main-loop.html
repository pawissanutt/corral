<!doctype html>
<html lang="en" class="t-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corral · main loop proposal</title>
<!-- Brand fonts ship beside this file; without them the page falls back to system fonts. -->
<link rel="stylesheet" href="css/fonts.css">
<style>
:root{
  --font:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
.t-dark{
  color-scheme:dark;
  --bg:oklch(.195 .012 240);--sunk:oklch(.17 .012 240);--surface:oklch(.225 .013 240);--surface-2:oklch(.255 .014 240);
  --shell:oklch(.155 .022 238);--shell-ink:oklch(.86 .012 238);--shell-ink-2:oklch(.70 .016 238);--shell-sel:oklch(.255 .035 238);--shell-rule:oklch(.27 .02 238);
  --rule:oklch(.29 .012 240);--rule-2:oklch(.36 .014 240);
  --ink:oklch(.94 .006 240);--ink-2:oklch(.80 .010 240);--ink-3:oklch(.72 .012 240);--ink-4:oklch(.66 .012 240);
  --sel:oklch(.275 .03 240);--hover:oklch(.24 .016 240);--focus:oklch(.86 .09 215);--selection:oklch(.86 .09 215/.35);
  --primary:oklch(.93 .006 240);--primary-ink:oklch(.18 .012 240);
  --you:oklch(.76 .15 58);--you-bg:oklch(.29 .06 58);--corral:oklch(.74 .12 278);--corral-bg:oklch(.27 .05 278);
  --worker:oklch(.78 .10 200);--worker-bg:oklch(.27 .04 200);--held:oklch(.84 .13 92);--held-bg:oklch(.29 .05 92);
  --fail:oklch(.70 .18 25);--fail-bg:oklch(.28 .07 25);--ok:oklch(.78 .13 152);--ok-bg:oklch(.27 .05 152);
  --shade:oklch(0 0 0/.55);
}
.t-light{
  color-scheme:light;
  --bg:oklch(.977 .003 230);--sunk:oklch(.955 .005 230);--surface:oklch(.995 .002 230);--surface-2:oklch(.945 .006 230);
  --shell:oklch(.27 .035 240);--shell-ink:oklch(.95 .008 238);--shell-ink-2:oklch(.80 .02 238);--shell-sel:oklch(.36 .045 238);--shell-rule:oklch(.36 .035 240);
  --rule:oklch(.89 .007 235);--rule-2:oklch(.80 .01 235);
  --ink:oklch(.21 .02 245);--ink-2:oklch(.36 .02 245);--ink-3:oklch(.44 .018 245);--ink-4:oklch(.51 .014 245);
  --sel:oklch(.925 .02 238);--hover:oklch(.955 .008 238);--focus:oklch(.50 .14 245);--selection:oklch(.50 .14 245/.25);
  --primary:oklch(.24 .025 245);--primary-ink:oklch(.98 .004 240);
  --you:oklch(.52 .16 50);--you-bg:oklch(.95 .04 60);--corral:oklch(.50 .16 278);--corral-bg:oklch(.95 .03 278);
  --worker:oklch(.50 .10 215);--worker-bg:oklch(.95 .025 205);--held:oklch(.51 .12 80);--held-bg:oklch(.95 .05 92);
  --fail:oklch(.53 .19 27);--fail-bg:oklch(.95 .035 25);--ok:oklch(.50 .13 152);--ok-bg:oklch(.95 .035 152);
  --shade:oklch(.2 .02 240/.25);
}

*{box-sizing:border-box;margin:0;scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent}
html,body{height:100%}
body{font:13px/1.45 var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow:hidden;caret-color:var(--focus)}
::selection{background:var(--selection)}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-radius:4px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none;padding:0}
h1,h2,h3{font-weight:650;text-wrap:balance}
code,.mono{font-family:var(--mono);font-size:.93em}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* state hues: colour carries state only */
.st{color:var(--ink-4)}
.h-you,.t-you{color:var(--you)}.h-corral,.t-corral{color:var(--corral)}.h-worker,.t-worker{color:var(--worker)}
.h-held,.t-held{color:var(--held)}.h-fail,.t-fail{color:var(--fail)}.h-ok,.t-ok{color:var(--ok)}.h-dim,.t-dim{color:var(--ink-3)}
.t-ink{color:var(--ink)}

/* shell */
.app{display:grid;grid-template:36px minmax(0,1fr)/var(--side-w,208px) minmax(0,1fr);height:100%}
.app.folded{--side-w:52px}
.titlebar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 10px 0 14px;background:var(--shell);color:var(--shell-ink);border-bottom:1px solid var(--shell-rule);font-size:12px;white-space:nowrap;min-width:0;overflow:hidden}
.titlebar>:not(.hl):not(.sp){flex:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:13px}
.titlebar .path,.titlebar .dim{color:var(--shell-ink-2)}
.hl{display:flex;align-items:center;gap:6px;color:var(--shell-ink)}
.hl i{width:6px;height:6px;border-radius:50%;background:oklch(.78 .13 152)}
.sp{flex:1}
.sample{border:1px solid oklch(.84 .13 92/.55);color:oklch(.84 .13 92);border-radius:4px;padding:1px 6px;font-family:var(--mono);font-size:11px}
.tb{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:5px;color:var(--shell-ink);font-weight:600;transition:background .15s}
.tb:hover,.tb[aria-pressed=true]{background:var(--shell-sel)}

/* the surface stays terse; a tooltip says the rest on hover, keyboard focus or long-press */
#tip{position:fixed;z-index:80;max-width:300px;padding:6px 9px;border:1px solid var(--rule-2);border-radius:6px;background:var(--surface-2);color:var(--ink);box-shadow:0 8px 24px -8px var(--shade);font-size:12.5px;line-height:1.4;pointer-events:none}
#tip[hidden]{display:none}
#tip.on{animation:tipin .14s var(--ease)}
@keyframes tipin{from{opacity:0;translate:0 3px}}
:not(button):not(a)[data-tip]{cursor:help}
button [data-tip],a [data-tip]{cursor:inherit}
.tok{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tok svg{width:14px;height:14px}
.tok b{font:600 12.5px var(--mono)}
.stats{display:flex;align-items:center;gap:16px;flex:1;min-width:0;flex-wrap:wrap}
.stats .tok svg{width:15px;height:15px}
.stats .tok b{font-size:14px}
.stats .more{font:600 13px var(--mono);color:var(--you);text-decoration:underline dotted;text-underline-offset:3px}
.mline{display:none}

.side{background:var(--shell);color:var(--shell-ink);display:flex;flex-direction:column;gap:2px;padding:10px 8px;border-right:1px solid var(--shell-rule);min-height:0;overflow:auto}
.ws{padding:4px 8px 10px;display:flex;align-items:flex-start;gap:6px}
.ws b{display:block;font-size:13.5px}
.ws small{color:var(--shell-ink-2);font-size:11.5px;line-height:1.3;display:block}
.ws .tb{margin-left:auto;padding:0 4px}
.nav{display:flex;align-items:center;gap:10px;height:30px;padding:0 9px;border-radius:6px;color:var(--shell-ink-2);font-weight:500;transition:background .15s,color .15s}
a.nav:hover{background:oklch(1 0 0/.05);color:var(--shell-ink)}
.nav.on{background:var(--shell-sel);color:oklch(.97 .005 238);font-weight:650}
.nav.off{opacity:.55;cursor:default}
.nav .cnt{margin-left:auto;font:11.5px var(--mono)}
.nav .cnt+.cnt{margin-left:10px;min-width:16px;text-align:right}
.nav .tag{display:none;width:24px;height:22px;border:1px solid var(--shell-rule);border-radius:5px;align-items:center;justify-content:center;font:600 11px var(--mono)}
#side-projects{display:flex;flex-direction:column;gap:2px}
.sh{display:flex;justify-content:space-between;padding:2px 9px 4px;font-size:11.5px;color:var(--shell-ink-2)}
.nav .cnt.you{color:oklch(.76 .15 58);font-weight:700}
.nav kbd{font:11px var(--mono);color:var(--shell-ink-2);width:10px;text-align:center}
.nav .cnt+kbd{margin-left:0}.nav .lbl+kbd{margin-left:auto}
.side hr{border:0;border-top:1px solid var(--shell-rule);margin:8px 6px}
.dev{margin-top:auto;padding:10px 8px 2px;border-top:1px solid var(--shell-rule);font-size:11.5px;color:var(--shell-ink-2);line-height:1.5}
.dev b{color:var(--shell-ink)}
.dev .mono{font-size:1em}
.app.folded .side .lbl,.app.folded .side .cnt,.app.folded .side kbd,.app.folded .ws div,.app.folded .dev,.app.folded .sh,.app.folded #side-projects svg{display:none}
.app.folded .nav .tag{display:flex}
.app.folded .nav{justify-content:center;padding:0}
.app.folded .ws{justify-content:center;padding:4px 0 10px}.app.folded .ws .tb{margin:0}

/* page frame */
#view{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.phead{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap;padding:14px 20px 12px;border-bottom:1px solid var(--rule)}
.phead h1{font-size:18px;letter-spacing:-.01em}
.lede{color:var(--ink-2);font-size:13.5px;flex:1;min-width:240px}
.lnk{color:inherit;font:inherit;text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:3px}
.lnk:hover{text-decoration-color:currentColor}
.lnk.plain{text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.lnk.plain svg{width:12px;height:12px;transition:transform .15s}
.lnk.plain svg.rot{transform:rotate(90deg)}
.scope{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 20px;border-bottom:1px solid var(--rule)}
.pc{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border:1px solid var(--rule);border-radius:12px;color:var(--ink-2);font-size:12px;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.pc:hover{background:var(--hover);color:var(--ink)}
.pc[aria-pressed=true]{background:var(--sel);border-color:var(--rule-2);color:var(--ink);font-weight:650}
.pc b{color:var(--you);font:700 11.5px var(--mono)}
.split{display:grid;flex:1;min-height:0;grid-template-columns:minmax(0,1fr) 380px}
.split.one{grid-template-columns:minmax(0,1fr)}
.split.s-agents{grid-template-columns:minmax(0,1fr) 448px}
.split.s-agents:not(.has-sel){grid-template-columns:minmax(0,1fr)}
.split.three{grid-template-columns:280px minmax(0,1fr) 372px}
.split.s-review{grid-template-columns:272px minmax(0,1fr) 300px}
.split.no-aside{grid-template-columns:272px minmax(0,1fr)}
.col{min-height:0;min-width:0;overflow:auto}
.col.fx{display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;min-height:0;overflow:auto}
.aside,.plist+.main{border-left:1px solid var(--rule)}
.aside.enter>*{animation:swap .22s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateX(6px)}}

/* buttons, chips, segmented */
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border:1px solid var(--rule-2);border-radius:6px;background:var(--surface);font-weight:600;font-size:12.5px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.btn.pri:hover{background:color-mix(in oklch,var(--primary) 88%,var(--bg))}
.btn.q{border-color:transparent;background:none;color:var(--ink-2)}
.btn.q:hover{background:var(--hover);color:var(--ink)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn.ic{padding:0;width:24px;justify-content:center}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 6px;border-radius:4px;font-size:11.5px;font-weight:650;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.chip.c-you{color:var(--you);background:var(--you-bg)}.chip.c-corral{color:var(--corral);background:var(--corral-bg)}
.chip.c-worker{color:var(--worker);background:var(--worker-bg)}.chip.c-held{color:var(--held);background:var(--held-bg)}
.chip.c-ok{color:var(--ok);background:var(--ok-bg)}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:6px;padding:2px;gap:2px}
.seg button{height:22px;padding:0 9px;border-radius:4px;font-weight:600;font-size:12px;color:var(--ink-3);transition:background .15s,color .15s;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--surface-2);color:var(--ink)}
.seg button[disabled]{opacity:.45;cursor:not-allowed}

/* rail: every mark keeps its shape, the stage in play names itself */
.track{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.track .ln{width:8px;height:1px;background:var(--rule-2)}
.track .st{display:inline-flex;align-items:center;gap:4px}
.track .st svg{width:14px;height:14px}
.track .s-done{color:var(--ink-3)}
.track b{font-weight:650;font-size:12px}

/* Now */
.loop{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:14px 20px 2px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.loop a{position:relative;display:flex;align-items:center;gap:10px;height:36px;padding:0 14px;border-left:1px solid var(--rule);transition:background .15s}
.loop a:first-child{border-left:0;border-radius:8px 0 0 8px}.loop a:last-child{border-radius:0 8px 8px 0}
.loop a:hover{background:var(--hover)}
.loop a+a::before{content:"";position:absolute;left:-5px;top:50%;width:8px;height:8px;border-top:1px solid var(--rule-2);border-right:1px solid var(--rule-2);background:var(--surface);transform:translateY(-50%) rotate(45deg)}
.loop>a>b{font-weight:650;margin-right:auto}
.loop .nil{color:var(--ink-4)}
.gh{display:flex;align-items:baseline;gap:8px;padding:20px 20px 6px;font-size:13px;font-weight:650;border-bottom:1px solid var(--rule)}
.gh .n{font:12px var(--mono);color:var(--ink-3);font-weight:400}
.gh small{margin-left:auto;display:inline-flex;align-items:center;gap:12px;font-weight:400;color:var(--ink-3);font-size:12px}
.ask{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:0 20px 0 0;border-bottom:1px solid var(--rule);transition:background .15s}
.ask:hover{background:var(--hover)}.ask.sel{background:var(--sel)}
.askmain{display:grid;grid-template-columns:14px 50px minmax(0,1fr) 36px;gap:10px;align-items:center;height:38px;padding:0 0 0 20px;width:100%}
.askmain.wp{grid-template-columns:14px 50px 60px minmax(0,1fr) 36px}
.askmain .dot{display:flex}
.askmain .dot svg{width:14px;height:14px}
.askmain .q{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.askmain .id,.askmain .pj,.askmain .age{color:var(--ink-3);font-size:12px}
.askmain .age{font-family:var(--mono);text-align:right}
.row{display:grid;grid-template-columns:12px 52px minmax(120px,1fr) 150px 36px 50px;gap:10px;align-items:center;width:100%;height:38px;padding:0 20px;border-bottom:1px solid var(--rule);transition:background .15s}
.row.wp{grid-template-columns:12px 52px 60px minmax(120px,1fr) 150px 36px 50px}
.row.cl{grid-template-columns:12px 52px minmax(120px,1fr) 150px 96px}
.row.cl.wp{grid-template-columns:12px 52px 60px minmax(120px,1fr) 150px 96px}
.row .pj,.pr .pj{color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .pj{grid-column:1;grid-row:2;align-self:center}
.row .stw{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:12.5px}
.row .stw svg{width:14px;height:14px}
.row .when{text-align:right;color:var(--ink-3);font-size:12px}
.pager{display:flex;align-items:center;gap:8px;padding:8px 20px;border-bottom:1px solid var(--rule);color:var(--ink-3);font-size:12px}
.row:hover{background:var(--hover)}.row.sel{background:var(--sel)}
.row .id,.row .age,.row .cost{color:var(--ink-3);font-size:12px}
.row .age,.row .cost{text-align:right}
.row .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nowt{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .dl svg{width:10px;height:10px;display:block}
.wrow{display:flex;align-items:center;gap:18px;padding:9px 20px;border-bottom:1px solid var(--rule);color:var(--ink-2)}

/* side column */
.sec{padding:14px 18px;border-bottom:1px solid var(--rule)}
.sec>h3{font-size:12px;color:var(--ink-3);margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.sec>h3 small{margin-left:auto;font-weight:400;font-size:11.5px}
.phd{padding:14px 18px 12px;border-bottom:1px solid var(--rule)}
.phd .r1{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:12px;min-height:24px}
.phd .r1 .btn{margin-left:auto}
.phd h2{font-size:16px;margin:4px 0 3px;letter-spacing:-.005em}
.phd .meta{color:var(--ink-3);font-size:12px}
.phd .seg{margin-top:10px}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.stages div{border-top:2px solid var(--rule);padding:8px 8px 0 0}
.stages .cur{border-top-color:currentColor}
.stages small{display:block;color:var(--ink-3);font-size:11.5px}
.stages b{display:flex;align-items:center;gap:5px;font-weight:650;color:var(--ink)}
.stages .cur b{color:inherit}
.stages code{display:block;color:var(--ink-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps li{display:flex;gap:8px;padding:3px 0;color:var(--ink-2)}
.steps li svg{margin-top:1px}
.steps .s-done{color:var(--ink)}.steps .s-next{color:var(--ink-3)}
.steps .s-now span,.steps .s-you span{color:var(--ink);font-weight:600}
.facts{display:grid;grid-template-columns:78px minmax(0,1fr);gap:6px 10px}
.facts dt{color:var(--ink-3)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.callout{border:1px solid color-mix(in oklch,var(--you) 55%,transparent);background:var(--you-bg);border-radius:8px;padding:10px 12px;display:grid;gap:8px;justify-items:start}
.callout p{color:color-mix(in oklch,var(--you) 35%,var(--ink))}
.callout b{color:var(--you)}
.dg li{display:grid;grid-template-columns:16px 50px minmax(0,1fr) auto;gap:8px;padding:6px 0;align-items:start}
.dg li+li{border-top:1px solid var(--rule)}
.dg svg{margin-top:1px}
.dg .id,.dg time{font:12px var(--mono);color:var(--ink-3);padding-top:1px}
.dg p{color:var(--ink-2)}
.evl li{display:grid;grid-template-columns:40px 50px minmax(0,1fr);gap:8px;padding:3px 0;color:var(--ink-2)}
.evl time,.evl .id{font:12px var(--mono);color:var(--ink-3)}
.opt{border:1px solid var(--rule-2);border-radius:8px;padding:10px 12px;margin-top:8px;background:var(--surface)}
.opt h4{font-size:13px;font-weight:650;display:flex;gap:8px;align-items:center}
.opt dl{display:grid;grid-template-columns:64px minmax(0,1fr);gap:3px 8px;margin:6px 0 8px;font-size:12.5px;color:var(--ink-2)}
.opt dt{color:var(--ink-3)}

/* Agents */
.rh,.ar{display:grid;grid-template-columns:92px 52px minmax(110px,1fr) minmax(150px,1.5fr) 118px;gap:12px;align-items:center;padding:0 20px;width:100%}
.s-agents:not(.has-sel) .rh,.s-agents:not(.has-sel) .ar{grid-template-columns:92px 52px 64px minmax(150px,1fr) minmax(220px,1.6fr) 118px 100px 44px 50px}
.s-agents.has-sel .c-wide{display:none}
.rh{height:30px;color:var(--ink-3);font-size:11.5px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--bg);z-index:1}
.ar{height:40px;border-bottom:1px solid var(--rule);transition:background .15s}
.ar:hover{background:var(--hover)}.ar.sel{background:var(--sel)}
.ar .id{font:12px var(--mono);color:var(--ink-3)}
.ar .ttl{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar .doing{display:flex;align-items:center;gap:8px;min-width:0;color:var(--ink-2)}
.ar .doing .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar .doing .bar{flex:none;width:56px;margin:0}
.ar .r{text-align:right}
.ar .c-wide{color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:block;height:3px;border-radius:2px;background:var(--rule);margin-top:5px;max-width:220px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--corral);border-radius:2px}
.strip{display:flex;align-items:flex-end;gap:2px;height:16px}
.strip i{width:4px;height:2px;border-radius:1px;background:var(--rule-2)}
.strip .v1{height:6px;background:var(--ink-4);opacity:.7}.strip .v2{height:11px;background:var(--ink-4);opacity:.85}.strip .v3{height:16px;background:var(--ink-4)}
.strip .tip{background:currentColor;opacity:1;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
.strip.big{height:28px;gap:3px}
.strip.big i{width:auto;flex:1}.strip.big .v1{height:10px}.strip.big .v2{height:19px}.strip.big .v3{height:28px}
.axis{display:flex;justify-content:space-between;color:var(--ink-4);font-size:11.5px;margin-top:4px}
.subh{display:flex;align-items:baseline;gap:8px;padding:22px 20px 6px;font-size:13px;font-weight:650;border-bottom:1px solid var(--rule)}
.subh small{color:var(--ink-3);font-weight:400;font-size:12px}
.subh .btn{margin-left:auto}
.srow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;height:38px;padding:0 20px;border-bottom:1px solid var(--rule);transition:background .15s}
.srow b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.srow:hover{background:var(--hover)}
.srow .id,.srow time{font:12px var(--mono);color:var(--ink-3)}
.btn[aria-disabled=true],.seg button[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.log li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:8px 0}
.log li+li{border-top:1px solid var(--rule)}
.log time{font:12px var(--mono);color:var(--ink-3);padding-top:1px}
.log p{color:var(--ink);max-width:62ch}
.log .sys p,.log .you p{color:var(--ink-2)}
.log .who{font-size:11.5px;color:var(--ink-3);display:block}
.log details{margin-top:6px}
.log summary{cursor:pointer;color:var(--ink-3);font-size:12px;list-style:none;display:inline-flex;gap:6px;align-items:center;border-radius:4px}
.log summary::-webkit-details-marker{display:none}
.log summary svg{width:12px;height:12px;transition:transform .15s}
.log details[open] summary svg{transform:rotate(90deg)}
.log summary:hover{color:var(--ink)}
.term{background:var(--sunk);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;font:12.5px/1.6 var(--mono);white-space:pre;overflow:auto;color:var(--ink-2)}
.log .term{margin-top:6px;font-size:12px}
.term.full{margin:14px 18px;min-height:340px}
.term .ok{color:var(--ok)}.term .cmd{color:var(--worker)}.term .dim{color:var(--ink-4)}
.tcap{padding:0 18px 14px;color:var(--ink-3);font-size:12px}
.composer{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--rule)}
.composer input{flex:1;min-width:0;height:32px;padding:0 10px;border:1px solid var(--rule-2);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit}
.composer input::placeholder{color:var(--ink-4)}
.composer input:focus-visible{outline-offset:0}
.composer.none{color:var(--ink-3);font-size:12px}

/* Plans, Review lists */
.plist .gh{padding:16px 16px 6px}
.pr{display:grid;grid-template-columns:60px minmax(0,1fr);gap:2px 8px;width:100%;padding:9px 16px;border-bottom:1px solid var(--rule);transition:background .15s}
.pr:hover{background:var(--hover)}.pr.sel{background:var(--sel)}
.pr .id{font:12px var(--mono);color:var(--ink-3);padding-top:1px}
.pr .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .ln2{grid-column:2;color:var(--ink-3);font-size:12px;display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden}
.pr .ln2 svg{width:12px;height:12px}
.segs{display:inline-flex;gap:2px}
.segs i{width:12px;height:5px;border-radius:1px;background:var(--rule-2)}
.segs .s-you{background:var(--you)}.segs .s-stale{background:var(--held)}.segs .s-now{background:var(--corral)}.segs .s-run{background:var(--worker)}.segs .s-done{background:var(--ok)}
.dhead{padding:16px 20px 14px;border-bottom:1px solid var(--rule)}
.dhead .r1{display:flex;gap:8px;align-items:center;color:var(--ink-3);font-size:12px;flex-wrap:wrap}
.dhead h2{font-size:19px;letter-spacing:-.01em;margin:6px 0 4px;max-width:34ch}
.dhead p{color:var(--ink-2);font-size:13.5px;max-width:70ch}
.dhead .tabs{margin-top:12px}
.blk{padding:16px 20px}
.blk>h3{font-size:12px;color:var(--ink-3);margin-bottom:10px;display:flex;gap:8px;align-items:baseline}
.blk>h3 small{font-weight:400}
.graph{position:relative;display:flex;gap:48px;align-items:center;overflow-x:auto;padding:4px 2px 8px}
.graph svg.edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.graph svg.edges path{fill:none;stroke:var(--rule-2);stroke-width:1.25}
.layer{display:flex;flex-direction:column;gap:12px}
.mcard{display:grid;gap:3px;width:236px;padding:10px 12px;border:1px solid var(--rule-2);border-radius:8px;background:var(--surface);transition:border-color .15s,background .15s;position:relative;z-index:1}
.mcard:hover{border-color:var(--ink-4)}
.mcard.sel{border-color:var(--ink);background:var(--sel)}
.mcard.you{border-color:color-mix(in oklch,var(--you) 60%,transparent);background:var(--you-bg)}
.mcard.you.sel{border-color:var(--you)}
.mcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mcard .id{font:12px var(--mono);color:var(--ink-3)}
.mcard .ttl{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phd .toks,.scope .seg{margin-left:auto}
.phd .toks{display:inline-flex;gap:12px}
.gnote{color:var(--ink-3);font-size:12px;margin-top:10px}
.pathl>li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;padding:0 0 14px;position:relative}
.pathl>li:not(:last-child)::before{content:"";position:absolute;left:7.5px;top:20px;bottom:2px;width:1px;background:var(--rule-2)}
.pathl>li>svg{margin-top:1px}
.pathl h4{font-size:13px;font-weight:650}
.pathl .s-next h4{color:var(--ink-2);font-weight:600}
.pathl p{color:var(--ink-2);font-size:12.5px}
.pathl ul{margin-top:6px;display:grid;gap:6px}
.pathl ul li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:6px;font-size:12.5px;color:var(--ink-2)}
.pathl ul li svg{width:14px;height:14px;margin-top:2px}
.warn{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;margin-top:6px;padding:8px 10px;border-radius:6px;background:var(--held-bg);color:color-mix(in oklch,var(--held) 45%,var(--ink));font-size:12.5px}
.warn svg{color:var(--held);margin-top:1px}
.pathl ul li>div,.warn>div{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.doc{padding:6px 20px 24px;max-width:76ch}
.doc h3{font-size:12px;color:var(--ink-3);margin:18px 0 6px}
.doc p,.doc li{font-size:13.5px;line-height:1.55;color:var(--ink)}
.doc ul{display:grid;gap:5px}
.doc li{padding-left:14px;position:relative}
.doc li::before{content:"";position:absolute;left:2px;top:.62em;width:4px;height:4px;border-radius:50%;background:var(--ink-4)}
.chainl li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;padding:5px 0;color:var(--ink-2)}
.chainl b{color:var(--ink);font-weight:600}
.vd li{padding:8px 0}
.vd li+li{border-top:1px solid var(--rule)}
.vd .h{display:flex;gap:6px;align-items:center;font-weight:650}
.vd p{color:var(--ink-2);font-size:12.5px;margin-top:3px}
.vd .old{opacity:.75}
.decide{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--rule);background:var(--bg)}
.empty{color:var(--ink-3);padding:6px 0;max-width:60ch}
.empty.pad{padding:16px 20px}

/* Review */
.ready>li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;padding:0 0 16px;position:relative}
.ready>li:not(:last-child)::before{content:"";position:absolute;left:7.5px;top:20px;bottom:2px;width:1px;background:var(--rule-2)}
.ready h4{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;font-weight:650}
.ready h4 code{font-weight:400;color:var(--ink-3)}
.ready blockquote{margin-top:8px;padding:8px 12px;border:1px solid var(--rule-2);border-radius:6px;background:var(--surface);max-width:68ch;line-height:1.5}
.ready blockquote small{display:block;color:var(--ink-3);font-size:12px;margin-bottom:2px}
.fl{border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.fr{display:grid;grid-template-columns:16px auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;height:36px;padding:0 12px;transition:background .15s}
.fl>div+div{border-top:1px solid var(--rule)}
.fr:hover{background:var(--hover)}
.fr>svg{color:var(--ink-3);transition:transform .15s}
.fr[aria-expanded=true]>svg{transform:rotate(90deg)}
.fr .p{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:12.5px var(--mono)}
.fr .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.fr .pm{font:12px var(--mono);white-space:nowrap}
.fbody{padding:2px 12px 4px;background:var(--bg)}
.hunk{border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin:8px 0 12px;font:12px/1.65 var(--mono)}
.hh{background:var(--surface);color:var(--ink-3);padding:3px 10px;border-bottom:1px solid var(--rule)}
.dfl{display:grid;grid-template-columns:42px 42px 18px minmax(0,1fr)}
.dfl span{color:var(--ink-4);text-align:right;padding-right:8px;user-select:none}
.dfl span.sg{text-align:center;padding:0}
.dfl code{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;padding-right:8px}
.dfl.del{background:var(--fail-bg)}.dfl.add{background:var(--ok-bg)}
.dfl.del .sg{color:var(--fail)}.dfl.add .sg{color:var(--ok)}
.sp2{display:grid;grid-template-columns:1fr 1fr}
.sp2 .dfl{grid-template-columns:42px 18px minmax(0,1fr)}
.sp2 .dfl:nth-child(even){border-left:1px solid var(--rule)}
.sp2 .dfl.void{background:var(--sunk)}
.cmt{font:13px/1.5 var(--font);margin:8px 12px 8px 54px;padding:8px 12px;border:1px solid var(--rule-2);border-radius:6px;background:var(--surface);max-width:70ch}
.cmt small{display:block;color:var(--ink-3);font-size:12px}
.dtools{display:flex;align-items:center;gap:10px;padding:12px 20px 0}
.fh{display:flex;gap:10px;align-items:baseline;margin-top:14px;font:12.5px var(--mono);flex-wrap:wrap}

/* notes drawer, toast */
#notes{position:fixed;top:36px;right:0;bottom:0;width:min(400px,100%);z-index:40;background:var(--surface);border-left:1px solid var(--rule-2);box-shadow:-18px 0 40px -18px var(--shade);overflow:auto;padding:16px 20px 28px;animation:swap .22s var(--ease)}
#notes[hidden]{display:none}
#notes h2{font-size:15px;display:flex;align-items:center}
#notes h2 .btn{margin-left:auto}
#notes h3{font-size:12px;color:var(--ink-3);margin:18px 0 6px}
#notes li{position:relative;padding:3px 0 3px 14px;color:var(--ink-2);line-height:1.5}
#notes li::before{content:"";position:absolute;left:2px;top:.75em;width:4px;height:4px;border-radius:50%;background:var(--ink-4)}
#notes li b{color:var(--ink);font-weight:650}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:var(--primary);color:var(--primary-ink);padding:8px 14px;border-radius:8px;font-weight:600;box-shadow:0 10px 30px -10px var(--shade);max-width:min(560px,92vw);transition:opacity .2s,translate .2s var(--ease)}
#toast.off{opacity:0;translate:0 8px;pointer-events:none}
#toast code{font-weight:500}

/* narrower windows: the side column yields first, then the sidebar folds, then it becomes a tab bar */
@media (max-width:1180px){
  .split,.split.s-agents,.split.s-agents:not(.has-sel){grid-template-columns:minmax(0,1fr);overflow:auto;align-content:start}
  .split.three,.split.s-review,.split.no-aside{grid-template-columns:260px minmax(0,1fr)}
  .split>.col{overflow:visible;min-height:auto}
  .titlebar .path{display:none}
  .split>.col.fx{display:block}
  .split.three>.aside{grid-column:2}
  .split>.aside{border-left:0;border-top:1px solid var(--rule)}
  .three>.aside{border-left:1px solid var(--rule)}
  .split.has-sel>.aside{position:fixed;top:36px;right:0;bottom:0;width:min(460px,100%);z-index:20;overflow:auto;background:var(--bg);border-left:1px solid var(--rule-2);border-top:0;box-shadow:-18px 0 40px -18px var(--shade)}
  .split.has-sel>.aside.fx{display:flex}
  .s-agents .c-wide{display:none}
  .s-agents:not(.has-sel) .rh,.s-agents:not(.has-sel) .ar{grid-template-columns:92px 52px minmax(110px,1fr) minmax(150px,1.5fr) 118px}
  .decide{position:sticky;bottom:0}
}
@media (max-width:900px){
  .app{--side-w:52px}
  .side .lbl,.side .cnt,.side kbd,.ws div,.dev,.ws .tb,.sh,#side-projects svg{display:none}
  .nav .tag{display:flex}
  .nav{justify-content:center;padding:0}
  .sample{display:none}
  .split.three,.split.s-review,.split.no-aside{grid-template-columns:minmax(0,1fr)}
  .split.three>.aside{grid-column:1}
  .plist+.main,.three>.aside{border-left:0;border-top:1px solid var(--rule)}
  .graph{flex-direction:column;align-items:stretch;gap:12px}
  .graph svg.edges{display:none}
  .mcard{width:100%}
}
@media (max-width:640px){
  .app{grid-template:36px minmax(0,1fr) 52px/minmax(0,1fr)}
  .side{grid-row:3;flex-direction:row;justify-content:space-around;align-items:center;padding:0 6px;border-right:0;border-top:1px solid var(--shell-rule);overflow:visible}
  .side .ws,.side hr,.side .nav.off,#side-projects{display:none}
  .scope{flex-wrap:nowrap;overflow-x:auto;padding:7px 14px}
  .pc{flex:none;height:32px}
  .scope .seg{flex:none}
  .side .nav{flex:1;flex-direction:column;gap:1px;height:44px;font-size:11px}
  .side .nav .lbl{display:block}
  .tb .lbl,.loop,#clock{display:none}
  .row{height:auto;padding:8px 14px;grid-template-columns:12px auto minmax(0,1fr) auto;grid-template-areas:"dl id ttl age" ". trk trk cost" ". now now pj";gap:3px 8px}
  .row .dl{grid-area:dl}.row .id{grid-area:id}.row .ttl{grid-area:ttl}.row .age{grid-area:age}.row .cost{grid-area:cost}.row .trk{grid-area:trk}.row .nowt{grid-area:now}
  .row.wp,.row.cl,.row.cl.wp{grid-template-columns:12px auto minmax(0,1fr) auto}
  .row.cl{grid-template-areas:"dl id ttl when" ". stw stw pj" ". now now now"}
  .row .pj{grid-area:pj;text-align:right}.row .stw{grid-area:stw}.row .when{grid-area:when}
  .mline{display:block}
  .ask{grid-template-columns:1fr;padding:0 14px 10px;gap:0}
  .askmain,.askmain.wp{height:auto;padding:10px 0 8px;grid-template-columns:14px auto minmax(0,1fr) auto;grid-template-areas:"dot id pj age" ". q q q" ". m m m";gap:3px 8px}
  .askmain .dot{grid-area:dot}.askmain .id{grid-area:id}.askmain .pj{grid-area:pj}.askmain .age{grid-area:age}.askmain .q{grid-area:q;white-space:normal}
  .askmain .mline{grid-area:m;color:var(--ink-2);font-size:12.5px}
  .ask>.btn{justify-self:start;margin-left:24px}
  .rh{display:none}
  .ar,.s-agents:not(.has-sel) .ar{height:auto;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"st ttl id" "dn dn dn" "ac ac ac";padding:10px 14px;gap:4px 10px}
  .ar .c-st{grid-area:st}.ar .ttl{grid-area:ttl}.ar .id{grid-area:id}.ar .doing{grid-area:dn}.ar .c-act{grid-area:ac}
  .ar .doing .tx{white-space:normal}
  .gh,.subh,.wrow,.phead,.blk,.dhead,.decide{padding-left:14px;padding-right:14px}
  #toast{bottom:64px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">

function diffRows(rows){
  const line=(cls,nums,sg,x)=>`<div class="dfl ${cls}">${nums.map(n=>`<span>${n??""}</span>`).join("")}<span class="sg">${sg}</span><code>${h(x)}</code></div>`;
  const cmt=r=>`<div class="cmt"><small>${h(r[1])}</small>${h(r[2])}</div>`;
  if(!S.split)return rows.map(r=>r[0]==="#"?cmt(r):line(r[0]==="-"?"del":r[0]==="+"?"add":"",[r[1],r[2]],r[0]==="c"?"":r[0]==="-"?"−":"+",r[3])).join("");
  let out="",i=0;const flush=pairs=>{if(pairs)out+=`<div class="sp2">${pairs}</div>`;};let buf="";
  while(i<rows.length){const r=rows[i];
    if(r[0]==="#"){flush(buf);buf="";out+=cmt(r);i++;continue;}
    if(r[0]==="c"){buf+=line("",[r[1]],"",r[3])+line("",[r[2]],"",r[3]);i++;continue;}
    const dels=[],adds=[];while(i<rows.length&&rows[i][0]==="-")dels.push(rows[i++]);while(i<rows.length&&rows[i][0]==="+")adds.push(rows[i++]);
    for(let k=0;k<Math.max(dels.length,adds.length);k++){const d=dels[k],a=adds[k];
      buf+=(d?line("del",[d[1]],"−",d[3]):line("void",[""],"",""))+(a?line("add",[a[2]],"+",a[3]):line("void",[""],"",""));}
  }
  flush(buf);return out;
}

  if(pg){go(pg);return;}
  if(e.key==="Escape"){if(S.notes)S.notes=false;else if(S.page==="now")S.now=null;else if(S.page==="agents")S.agent=null;else if(S.page==="plans")S.member=null;render();return;}
  if((e.key==="j"||e.key==="k")&&ORDER[S.page]){const ids=ORDER[S.page](),key=SELKEY[S.page],i=ids.indexOf(S[key]),n=Math.max(0,Math.min(ids.length-1,i+(e.key==="j"?1:-1)));if(!ids.length)return;
    S[key]=ids[i<0?0:n];if(S.page==="plans")S.member=null;if(S.page==="review")S.rtab="brief";render();
    const el=document.querySelector(".sel");if(el)el.scrollIntoView({block:"nearest"});}
});

/* ---------- tooltips: hover and keyboard focus; long-press where there is no hover ---------- */
const tipEl=document.body.appendChild(document.createElement("div"));tipEl.id="tip";tipEl.setAttribute("role","tooltip");tipEl.hidden=true;
let tipFor=null,tipWait=null,tipT=0,tipHid=0,pressT=0,pressed=false;
function showTip(el,x){
  if(!el.isConnected)return;
  tipWait=null;tipFor=el;tipEl.textContent=el.dataset.tip;tipEl.hidden=false;tipEl.classList.add("on");
  const r=el.getBoundingClientRect(),w=tipEl.offsetWidth,ht=tipEl.offsetHeight,cx=r.width>260?(x??r.left+130):r.left+r.width/2;
  let y=r.top-ht-6;if(y<42)y=r.bottom+6;
  tipEl.style.left=Math.max(8,Math.min(innerWidth-w-8,cx-w/2))+"px";tipEl.style.top=y+"px";
  el.setAttribute("aria-describedby","tip");
}
function hideTip(){
  clearTimeout(tipT);tipWait=null;if(!tipFor)return;
  tipFor.removeAttribute("aria-describedby");tipFor=null;tipEl.hidden=true;tipEl.classList.remove("on");tipHid=Date.now();
}
document.addEventListener("mouseover",e=>{
  if(pressed)return;
  const el=e.target.closest("[data-tip]");
  if(el===tipFor||(el&&el===tipWait))return;
  hideTip();
  if(el){tipWait=el;const x=e.clientX;tipT=setTimeout(()=>showTip(el,x),Date.now()-tipHid<500?60:350);}
});
document.documentElement.addEventListener("mouseleave",hideTip);
document.addEventListener("focusin",e=>{
  const t=e.target;if(!t.matches(":focus-visible"))return;
  const el=t.matches("[data-tip]")?t:t.querySelector(".trk[data-tip],.doing[data-tip]")||t.querySelector("[data-tip]");
  hideTip();if(el)showTip(el);
});
document.addEventListener("focusout",hideTip);
document.addEventListener("keydown",e=>{if(e.key==="Escape")hideTip();},true);
document.addEventListener("scroll",hideTip,true);
document.addEventListener("click",e=>{if(pressed){e.preventDefault();e.stopPropagation();}else hideTip();},true);
document.addEventListener("touchstart",e=>{hideTip();const el=e.target.closest("[data-tip]");if(el)pressT=setTimeout(()=>{pressed=true;showTip(el,e.touches[0].clientX);},450);},{passive:true});
document.addEventListener("touchmove",()=>clearTimeout(pressT),{passive:true});
document.addEventListener("touchend",()=>{clearTimeout(pressT);if(pressed)setTimeout(()=>{pressed=false;},400);},{passive:true});
document.addEventListener("contextmenu",e=>{if(pressed)e.preventDefault();});
for(const k of ["now","agents","plans","review","project"])NOTES[k].change.push("<b>Terse surface, full sentences on demand.</b> A count is an icon and a number; hover or keyboard focus says the rest. Touch has no hover, so long-press shows the same tooltip and phone rows keep one explanatory line.");
addEventListener("hashchange",()=>go(location.hash.slice(1)));
addEventListener("resize",()=>{if(S.page==="plans")drawEdges();});
const tick=()=>{const d=new Date();$("#clock").textContent=d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit",hour12:false});};
tick();setInterval(tick,20000);
go(location.hash.slice(1)||"now");
if(document.fonts)document.fonts.ready.then(()=>{if(S.page==="plans")drawEdges();});
</script>
