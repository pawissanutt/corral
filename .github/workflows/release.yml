name: Release

on:
  pull_request:
  push:
    branches: [main, "corral/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gate prerequisites
        run: |
          exec </dev/null
          sudo apt-get update
          sudo apt-get install -y apparmor bubblewrap strace shellcheck
          sudo apparmor_parser --replace scripts/ci-bwrap.apparmor
          bwrap --ro-bind / / --dev /dev --proc /proc -- /bin/true
          curl -fsSLo "$RUNNER_TEMP/herdr-install.sh" https://herdr.dev/install.sh
          sh "$RUNNER_TEMP/herdr-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Installer regressions and diagnostics
        run: |
          exec </dev/null
          shellcheck install.sh scripts/install-test.sh
          sh scripts/install-test.sh
          python scripts/test_gate.py
      - name: Full gate in isolated plugin-free herdr
        env:
          CORRAL_SIZE_LIMITS: '{"rs":800}'
        run: |
          exec </dev/null
          set -o pipefail
          source scripts/test-herdr.sh
          corral_test_herdr_start
          scripts/gate.sh 2>&1 | tee "$RUNNER_TEMP/gate.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-log
          path: ${{ runner.temp }}/gate.log
          if-no-files-found: warn

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release tag matches the manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python -c 'import os,tomllib; v=tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"]; assert os.environ["GITHUB_REF_NAME"] == "v"+v, "release tag must match Cargo.toml"'
      - if: runner.os == 'Linux'
        run: sudo apt-get update </dev/null && sudo apt-get install -y musl-tools </dev/null
      - name: Native platform tests
        run: |
          exec </dev/null
          cargo test --locked -p corral-core -p corral-git
          cargo test --locked -p corral-herdr --lib
          cargo test --locked -p corral-ops --lib native
          cargo test --locked -p corral --test native_runtime
      - name: Darwin runtime without default features
        if: runner.os == 'macOS'
        run: cargo check --locked -p corral-ops --no-default-features --target ${{ matrix.target }} </dev/null
      - name: Build release binary
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
          CORRAL_BUILD_SHA: ${{ github.sha }}
        run: cargo build --release --locked -p corral --target ${{ matrix.target }} </dev/null
      # Pi-native runs on Unix only. The host is compiled natively on each runner, so its
      # platform add-ons match; the Bun version must equal the GO manifest's pin.
      - if: runner.os != 'Windows'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Build the compiled Pi-native host
        if: runner.os != 'Windows'
        run: sh scripts/build-pi-host.sh "target/${{ matrix.target }}/release/corral-pi-host" </dev/null
      - name: Package archive and checksum
        run: python scripts/package-release.py ${{ matrix.target }} </dev/null
      - name: Native clean install and failure-path proof without Rust
        run: python scripts/release-install-test.py dist ${{ matrix.target }} </dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-*-*"
          path: dist
          merge-multiple: true
      - name: Verify checksums and publish
        run: |
          exec </dev/null
          (cd dist && sha256sum -c ./*.sha256)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
