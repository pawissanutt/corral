[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "0.9"
toml_edit = "0.23"
jiff = { version = "0.2", features = ["serde"] }
sha2 = "0.10"
ratatui = "0.30"
unicode-width = "0.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
corral-core = { path = "crates/corral-core" }
corral-herdr = { path = "crates/corral-herdr" }
corral-git = { path = "crates/corral-git" }
corral-ops = { path = "crates/corral-ops" }
corral-tui = { path = "crates/corral-tui" }
