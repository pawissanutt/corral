[profile.default]
# Leave capacity for another gate and the owner's interactive work on 32 cores.
test-threads = 12
retries = 0
# Report only; nextest must not terminate a test for this timing reference.
slow-timeout = "10s"

# scripts/gate_repair.py turns a failed run's report into narrow rerun commands.
[profile.default.junit]
path = "junit.xml"

[test-groups]
# Live tests share one private test-herdr server per suite. Keep its workspace,
# focus, delivery, and inventory transitions apart; fake-engine tests stay parallel.
herdr = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(/(^live$|_live$)/)'
test-group = "herdr"
threads-required = 2

[profile.quick]
# Keep the wide Git-settings matrix out of quick, but in the default profile.
default-filter = 'not (binary_id(=corral-git) & test(=memo_tests::settings_changes_never_serve_facts_computed_under_other_settings))'

[profile.quick.junit]
path = "junit.xml"

# Keep the explicit lane available to gate_lanes.py and the nightly runner.
# There are currently no Rust slow-catalog entries.
[profile.slow]
slow-timeout = "30s"
default-filter = '''
none()
'''

# Measured integration exception: the Git-settings invalidation matrix must
# recompute facts using real Git. This guard is report-only.
[[profile.default.overrides]]
filter = 'binary_id(=corral-git) & test(=memo_tests::settings_changes_never_serve_facts_computed_under_other_settings)'
slow-timeout = "30s"
