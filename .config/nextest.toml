[profile.default]
# Leave capacity for another gate and the owner's interactive work on 32 cores.
test-threads = 12
retries = 0
# The gate's candidate-bound runner enforces 10s only while observed load is quiet.
# Native nextest reports at 10s but must not kill on a busy host independently.
# Explicit measured exceptions retain their original 30s report-only guards.
slow-timeout = "10s"

[test-groups]
# Live tests share one private test-herdr server per suite. Keep its workspace,
# focus, delivery, and inventory transitions apart; fake-engine tests stay parallel.
herdr = { max-threads = 1 }

[[profile.default.overrides]]
filter = '''
binary(/(^live$|_live$)/)
| test(herdr_dispatch_sync_reply_jump_retry)
| test(isolated_corral_test_fills_and_refills_authorized_slots)
| test(drop_running_and_needs_me_closes_owned_live_panes_only_after_confirmation)
| test(publication_sync_)
| test(app::plan_review_live_tests::)
| test(assistants::live_tests::)
| test(agent::herdr_status::tests::live_)
'''
test-group = "herdr"
# The live CLI fixtures also launch Git, corral, and Python subprocesses.
threads-required = 2

# Fixed torture catalog, not a duration percentile that silently changes membership.
# Claims: eight independent processes racing 1000 claims, beyond ordinary authority tests.
# Crashes: SQLite stop-point matrices, beyond non-crashing exact-once entry tests.
# Ledger: 40-seed differential oracle, beyond small exact cleanup/counter tests.
# Delivery: cross-restart FIFO/unsafe-attempt matrices, beyond bounded retry unit tests.
# Projection: interrupted publication identity/authority replay matrices.
# Carry: verification-input permutation matrix across approval and full landing.
# Launch: revocation/crash-stage matrices, beyond real-entry smoke coverage.
# Plans: repeated multi-member full-gate/failure-repair journeys; ordinary member tests remain.
# Cleanup: retained-branch approval corruption matrix across process restart.
# Quick skips this catalog; declared tests can opt in. The extra memo test exercises
# a wide Git-settings matrix and remains excluded from quick as before.
[profile.quick]
default-filter = '''
not (
  (binary_id(=corral-ops) & test(operating::records_tests::one_winner_per_thousand_claims_raced_by_eight_independent_processes))
| (binary_id(=corral-ops) & test(submission_paths_tests::crashes::) & not test(submission_paths_child_entry))
| (binary_id(=corral-ops) & test(cleanup::ledger_tests::ledger_cleanup_closes_what_the_history_walk_closed))
| (binary_id(=corral-ops::attention_eval) & test(=delivery_history::s21_prior_unsafe_attempts_bar_rejected_resends_after_restart_and_fifo_promotion))
| (binary_id(=corral-ops::attention_eval) & test(=delivery_history::s21_ten_current_attempts_preserve_prior_unsafe_witness_on_every_recipient))
| (binary_id(=corral-ops::attention_eval) & test(=delivery_history::s21_unattempted_replacements_retry_original_recipient_after_restart_and_promotion))
| (binary_id(=corral-ops::plan_ops) & test(self_projection_restart))
| (binary_id(=corral-ops::autopilot_ops) & test(inputs_changed_between_approval))
| (binary_id(=corral-ops::operating_launch) & test(interrupted_coding_stages))
| (binary_id(=corral-ops::operating_launch) & test(concrete_planning_paths))
| (binary_id(=corral-ops::operating_launch) & test(concrete_gate_and_profile_reviewer))
| (binary_id(=corral-ops::gate_tiers_e2e) & test(=plan::a_member_fixing_the_expected_failure_lets_plan_verify_pass_and_main_receive_that_candidate))
| (binary_id(=corral-ops::gate_tiers_e2e) & test(=plan::audited_quick_members_gate_once_per_round_carry_and_plan_verify_fails_on_the_full_tier))
| (binary_id(=corral-ops::gate_tiers_e2e) & test(=plan::one_plan_recovers_from_a_failed_full_verify_by_adding_and_landing_a_fixing_member))
| (binary_id(=corral-ops::cleanup_ops) & test(retained_branch_cleanup_refuses))
| (binary_id(=corral-git) & test(=memo_tests::settings_changes_never_serve_facts_computed_under_other_settings))
)
'''

# Explicit slow lane; full landings restore catalog entries on owning-module changes
# (scripts/gate_lanes.py). Plan verify and legacy/missing context run all tests.
[profile.slow]
slow-timeout = "30s"
default-filter = '''
(binary_id(=corral-ops) & test(operating::records_tests::one_winner_per_thousand_claims_raced_by_eight_independent_processes))
| (binary_id(=corral-ops) & test(submission_paths_tests::crashes::) & not test(submission_paths_child_entry))
