[package]
name = "corral-daemon"
default-run = "corrald-next"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
lite-analyst-faults = []

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
corral-engine.workspace = true
corral-herdr.workspace = true
corral-types.workspace = true
corral-facts.workspace = true
corral-protocol.workspace = true
clap.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["event", "fs", "net", "pipe", "process", "system", "thread", "time"] }
snow.workspace = true
tungstenite.workspace = true
httparse = "1"
getrandom = "0.4"
base64.workspace = true
sha2.workspace = true
toml.workspace = true
web-push = { version = "0.11", default-features = false, features = ["isahc-client"] }
isahc = { version = "1.7", default-features = false }
futures-lite = "2"

[target.'cfg(target_os = "linux")'.dependencies]
ignore = "0.4.35"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }

[[bin]]
name = "corrald-next"
path = "src/main.rs"
