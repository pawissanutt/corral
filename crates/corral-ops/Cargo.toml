[package]
name = "corral-ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
jiff.workspace = true
pulldown-cmark.workspace = true
sha2.workspace = true
flate2.workspace = true
tempfile.workspace = true
corral-core.workspace = true
corral-herdr.workspace = true
corral-git.workspace = true
getrandom = "0.4"
notify = "8.2"
fs2 = "0.4"
memchr = "2.8"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process", "event", "param", "fs", "time", "net"] }

[target.'cfg(windows)'.dependencies]
winsafe = { version = "0.0.29", features = ["kernel"] }
process-wrap = { version = "10", default-features = false, features = ["std", "job-object", "creation-flags"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
kqueue = "1.2"

[features]
# Enabled only by dev-dependencies: test builds never probe the owner's omp/omo/claude on PATH.
hermetic-harness = []

[dev-dependencies]
tempfile.workspace = true
corral-ops = { path = ".", features = ["hermetic-harness"] }
