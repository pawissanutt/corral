id = "task-session-lifecycle"
title = "Task session lifecycle: observed worker activity"
kind = "state"
read_at = "950cc13b5432dcbaac93b81449e518eab1102810"
states_from = { path = "crates/corral-types/src/lib.rs", name = "SessionStatus" }

# Edges describe changes between observations of a Pi task session, not writes to
# the task's board status. sync.rs::reconcile_sample applies those task effects
# only to the latest, still-open run when the session and task event sequence agree.
# A blocked observation can block a Running worker task (unless pickup attention
# takes precedence); Working returns a worker task waiting for a reply to Running.

[[states]]
id = "working"
label = "Working"
anchor = { path = "crates/corral-types/src/lib.rs", text = "pub enum SessionStatus {\n    Working," }

[[states]]
id = "blocked"
label = "Blocked"
anchor = { path = "crates/corral-types/src/lib.rs", text = "Blocked { excerpt: String }," }

[[states]]
id = "idle"
label = "Idle"
anchor = { path = "crates/corral-types/src/lib.rs", text = "    Idle,\n    Gone," }

[[states]]
id = "gone"
label = "Gone"
anchor = { path = "crates/corral-types/src/lib.rs", text = "    Gone,\n}" }

[[transitions]]
from = "idle"
to = "working"
label = "Observe an open turn"
guard = "No owner question is pending"
anchor = { path = "crates/corral-engine/src/runner/pi/activity.rs", text = "else if state.turn.open {\n            SessionStatus::Working" }

[[transitions]]
from = "working"
to = "idle"
label = "Observe a quiet session"
guard = "No owner question or open turn; the host is paused or has no last error"
anchor = { path = "crates/corral-engine/src/runner/pi/activity.rs", text = "else {\n            SessionStatus::Idle" }

[[transitions]]
from = "working"
to = "blocked"
label = "Observe a pending owner question"
anchor = { path = "crates/corral-engine/src/runner/pi/activity.rs", text = "if let Some(question) = state.owner_questions.into_iter().next() {\n            SessionStatus::Blocked" }

[[transitions]]
from = "idle"
to = "blocked"
label = "Observe an error while not paused"
guard = "No owner question or open turn"
anchor = { path = "crates/corral-engine/src/runner/pi/activity.rs", text = "&& let Some(excerpt) = state.last_error\n        {\n            SessionStatus::Blocked { excerpt }" }

[[transitions]]
from = "blocked"
to = "working"
label = "Observe work resume"
guard = "No owner question remains and a turn is open"
anchor = { path = "crates/corral-engine/src/runner/pi/activity.rs", text = "else if state.turn.open {\n            SessionStatus::Working" }

[[transitions]]
from = "blocked"
to = "idle"
label = "Observe the block clear without an open turn"
guard = "No owner question remains; the host is paused or has no last error"
anchor = { path = "crates/corral-engine/src/runner/pi/activity.rs", text = "else {\n            SessionStatus::Idle" }

# Confirmed loss ends the observed run. For a worker, reconciliation also blocks
# a Running task or one waiting for a reply and offers retry or force-approve.
[[transitions]]
from = "working"
to = "gone"
label = "Confirm host loss during work"
guard = "On Linux, the Pi socket is missing or refuses connections and host absence is confirmed"
anchor = { path = "crates/corral-engine/src/runner/pi/activity.rs", text = "task_host::confirmed_absent(_dir, socket) =>\n            {\n                return Ok((SessionStatus::Gone, None, None));" }

[[transitions]]
from = "blocked"
to = "gone"
label = "Confirm host loss while blocked"
guard = "On Linux, the Pi socket is missing or refuses connections and host absence is confirmed"
anchor = { path = "crates/corral-engine/src/runner/pi/activity.rs", text = "task_host::confirmed_absent(_dir, socket) =>\n            {\n                return Ok((SessionStatus::Gone, None, None));" }

[[transitions]]
from = "idle"
to = "gone"
label = "Confirm host loss while idle"
guard = "On Linux, the Pi socket is missing or refuses connections and host absence is confirmed"
anchor = { path = "crates/corral-engine/src/runner/pi/activity.rs", text = "task_host::confirmed_absent(_dir, socket) =>\n            {\n                return Ok((SessionStatus::Gone, None, None));" }
