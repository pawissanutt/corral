[package]
name = "nsh-app-corral"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace]

[features]
# The native desktop backends (GTK 4 on Linux, AppKit on macOS, Win32 on Windows) for `cargo run`.
# Off by default: the web, terminal and headless builds must not need the GTK development packages.
desktop = ["dep:nsh-platform-linux", "dep:nsh-platform-macos", "dep:nsh-platform-windows", "dep:env_logger"]

[[bin]]
name = "nsh-app-corral"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
nsh-core = "0.5.0"
nsh-base = "0.5.0"
env_logger = { version = "0.11", optional = true }
corral-protocol = { path = "../../crates/corral-protocol" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
jiff = "0.2"

[dev-dependencies]
nsh-engine = "0.5.0"
nsh-testing = "0.5.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustix = { version = "1.1", features = ["event", "fs", "net", "process", "system"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
jiff = { version = "0.2", features = ["js"] }
snow = { version = "=0.10.0", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-blake2"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "CloseEvent", "BinaryType", "Window", "Crypto", "Performance", "Location", "History"] }
futures-channel = "0.3"
futures-core = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.0", optional = true, default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.5.0", optional = true, default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.5.0", optional = true, default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }
