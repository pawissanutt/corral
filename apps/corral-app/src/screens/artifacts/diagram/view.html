<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<style>
html{color-scheme:light dark}body{margin:0;font:13px system-ui,sans-serif;background:var(--bg);color:var(--ink);--bg:#f7f8fa;--ink:#1d2733;--rule:#c9d1db;--dot:#dfe4ea}
@media (prefers-color-scheme:dark){body{--bg:#141b23;--ink:#eaf0f6;--rule:#3a4756;--dot:#2c3742}}
#graph{height:calc(100vh - 37px);background:radial-gradient(circle,var(--dot) 1px,transparent 1px) 0 0/19px 19px}
header{height:36px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--rule)}header span{margin-right:auto;opacity:.75}
button{color:inherit;background:transparent;border:1px solid var(--rule);border-radius:6px;padding:3px 10px;font:inherit}button:focus-visible{outline:2px solid #2aa198}
</style>
<header><span>Drag to pan · scroll to zoom</span><button id="fit" type="button">Fit</button></header>
<div id="graph"></div>
<script id="diagram-data" type="application/json"><!--DATA--></script>
<script>/*G6-BUNDLE*/</script>
<script>
'use strict';
// First-party viewer: draws the IDs and plain labels the app hands it and reports only the ID
// of a clicked element. It never reads source, follows links or runs anything it is given.
const VERSION = 1;
const input = JSON.parse(document.getElementById('diagram-data').textContent);
const ids = new Set([...input.nodes, ...input.edges, ...(input.groups ?? [])].map(e => e.id));
const notify = value => window.nsh?.postMessage(value);
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
const ink = dark ? '#eaf0f6' : '#1d2733';
const card = dark ? '#202b37' : '#ffffff';
const quiet = dark ? '#8398ad' : '#7a8896';
const pick = dark ? '#83e2d6' : '#0f8a7e';
const pickGround = dark ? '#23474a' : '#dcf3ef';
const stroke = {step: quiet, decision: dark ? '#eac982' : '#b7862a', end: dark ? '#83e2d6' : '#2a8d84'};
// A comparison's marks: how an element's bound source changed. The list beside the graph says
// the same in words, so colour and dash are never the only signal.
const MARKS = ['changed', 'moved', 'removed', 'added', 'unknown', 'failed'];
const markInk = {
  changed: dark ? '#f0b35e' : '#b8650a', moved: dark ? '#8fb8ff' : '#2f62c4',
  removed: dark ? '#ff8a80' : '#c23a2f', added: dark ? '#9be28a' : '#2f8a2a', unknown: quiet, failed: dark ? '#ff8a80' : '#c23a2f',
};
const markNode = m => ({stroke: markInk[m], lineWidth: 2.6, lineDash: m === 'removed' || m === 'unknown' ? [4, 3] : 0, halo: true, haloStroke: markInk[m], haloLineWidth: 6, haloStrokeOpacity: 0.25});
const markEdge = m => ({stroke: markInk[m], lineWidth: 2.6, lineDash: m === 'removed' || m === 'unknown' ? [4, 3] : 0});
const host = document.getElementById('graph');
const measure = document.createElement('canvas').getContext('2d');
measure.font = '600 13px system-ui, sans-serif';
// A card fits its label up to two lines; past that the label wraps within the widest card.
const widthOf = label => Math.min(220, Math.max(92, Math.ceil(measure.measureText(label).width) + 30));
// G6 keys its elements in a plain object, so a recipe ID such as `constructor` would meet a
// built-in property; every ID it sees carries this prefix, and events give the recipe's back.
const PREFIX = 'el:';
const own = id => PREFIX + id;
const recipeId = id => typeof id === 'string' && id.startsWith(PREFIX) ? id.slice(PREFIX.length) : null;
const data = {
  combos: (input.groups ?? []).map(g => ({id: own(g.id), data: {label: g.label}})),
  nodes: input.nodes.map(n => ({id: own(n.id), ...(n.group ? {combo: own(n.group)} : {}), data: {label: n.label, kind: n.kind, start: n.start, w: widthOf(n.label)}})),
  // A back edge is laid out from its target, so the layout's ranks follow the flow from its
  // start; its arrow stays on its own target and its bow on its own side.
  edges: input.edges.map(e => ({
    id: own(e.id), source: own(e.back ? e.target : e.source), target: own(e.back ? e.source : e.target),
    data: {label: e.label ?? '', fromLabel:e.fromLabel, toLabel:e.toLabel, kind: e.kind, bow: e.back ? -e.bow : e.bow, back: e.back, loop: e.loop},
  })),
};
// Ordered lanes are fixed columns. Each message has its own row and invisible attachment
// points; synthetic IDs live outside the recipe namespace and cannot select an element.
if (input.ordered) {
  const columns = new Map(input.nodes.map((n, i) => [n.id, i * 240]));
  const point = (key,x,y) => { data.nodes.push({id:key,style:{x,y},data:{point:true,w:1,label:''}}); return key; };
  data.nodes.forEach(n => {n.style = {x:columns.get(recipeId(n.id)), y:0};});
  input.edges.forEach((e,i) => {
    const y = 70 + i * 74;
    const edge = data.edges[i];
    edge.source = point('from:'+i, columns.get(e.source), y);
    edge.target = e.source === e.target ? edge.source : point('to:'+i, columns.get(e.target), y);
    edge.data.bow = 0; edge.data.label = (i+1)+'. '+edge.data.label;
  });
  input.nodes.forEach((n,i) => {
    const end = point('end:'+i, columns.get(n.id), 76 + input.edges.length*74);
    data.edges.unshift({id:'lane:'+i,source:own(n.id),target:end,data:{lane:true,bow:0,label:''}});
  });
}
// A node's self links alternate above and below it, each pair further out than the last.
const loopPlacement = d => d.data.loop % 2 === 0 ? 'top' : 'bottom';
const loopDist = d => 36 + 40 * Math.floor((d.data.loop ?? 0) / 2);
async function start() {
  // Keep endpoint cardinalities next to their ends rather than merging them into an
  // ambiguous centre label. They are ordinary canvas text, never HTML.
  class LabeledLink extends G6.Quadratic {
    drawLabelShape(attrs, container) {
      super.drawLabelShape(attrs, container);
      for (const [key, place] of [['fromLabel', 0.14], ['toLabel', 0.86]]) {
        const label = attrs[key];
        if (!label) continue;
        const style = this.getLabelStyle({...attrs, labelText:label, labelPlacement:place, labelOffsetY:-12});
        this.upsert(key, G6.Label, style, container);
      }
    }
  }
  G6.register(G6.ExtensionCategory.EDGE, 'endpoint-link', LabeledLink);
  const graph = new G6.Graph({
    container: host, width: host.clientWidth, height: host.clientHeight,
    padding: 24, animation: false, zoomRange: [0.25, 2.5], data,
    ...(input.ordered ? {} : {layout: {type: 'antv-dagre', rankdir: 'LR', nodesep: 46, ranksep: 84, sortByCombo:true}}),
    combo: {type:'rect',style:{labelText:d=>d.data.label, labelFill:ink, fill:card,fillOpacity:0.2,stroke:quiet,padding:18},state:{selected:{stroke:pick,lineWidth:3},...Object.fromEntries(MARKS.map(m=>[m,markNode(m)]))}},
    node: {
      type: 'rect',
      style: {
        size: d => d.data.point ? [1,1] : [d.data.w, 46], opacity:d=>d.data.point ? 0 : 1, radius: d => d.data.kind === 'decision' ? 18 : 8,
        fill: card, stroke: d => stroke[d.data.kind] ?? quiet,
        lineWidth: d => d.data.start ? 2.4 : 1.4, lineDash: d => d.data.kind === 'end' ? [5, 3] : 0,
        labelText: d => d.data.label, labelPlacement: 'center', labelFill: ink,
        labelFontWeight: 600, labelFontSize: 13, labelWordWrap: true,
        labelMaxWidth: d => d.data.w - 16, labelMaxLines: 2, labelTextOverflow: 'ellipsis',
        cursor: 'pointer',
      },
      state: {selected: {fill: pickGround, stroke: pick, lineWidth: 3}, ...Object.fromEntries(MARKS.map(m => [m, markNode(m)]))},
    },
    edge: {
      type: d => d.data.fromLabel || d.data.toLabel ? 'endpoint-link' : 'quadratic',
      style: {
        fromLabel:d=>d.data.fromLabel, toLabel:d=>d.data.toLabel,
        stroke: quiet, lineWidth: 1.5, increasedLineWidthForHitTesting: 10,
        lineDash:d=>d.data.lane?[4,4]:0, endArrow: d => !d.data.back && !d.data.lane, startArrow: d => d.data.back, endArrowSize: 8,
        startArrowSize: 8, curveOffset: d => d.data.bow, loopPlacement, loopDist,
        labelText: d => d.data.label, labelAutoRotate: false, labelBackground: true,
        labelBackgroundFill: card, labelBackgroundStroke: quiet, labelBackgroundLineWidth: 1,
        labelBackgroundRadius: 4, labelPadding: [2, 6], labelFill: ink, labelFontSize: 12,
        labelMaxWidth: 160, labelTextOverflow: 'ellipsis', cursor: 'pointer',
      },
      state: {selected: {stroke: pick, lineWidth: 3, labelBackgroundFill: pickGround, labelBackgroundStroke: pick}, ...Object.fromEntries(MARKS.map(m => [m, markEdge(m)]))},
    },
    behaviors: ['drag-canvas', 'zoom-canvas'],
  });
  const report = e => {
    const id = recipeId(e.target.id);
    if (id !== null && ids.has(id)) notify(JSON.stringify({v: VERSION, pick: id}));
  };
  graph.on('node:click', report);
  graph.on('edge:click', report);
  graph.on('combo:click', report);
  // Fit the graph to the view, never enlarging a small one past its own size; centred. The
  // zoom floor follows what this graph needs in this view, so no fit leaves part of it out.
  const ZOOM_FLOOR = 0.25;
  const needed = () => {
    const boxes = [...data.nodes, ...data.edges].map(e => graph.getElementRenderBounds(e.id));
    const lo = [0, 1].map(a => Math.min(...boxes.map(b => b.min[a])));
    const hi = [0, 1].map(a => Math.max(...boxes.map(b => b.max[a])));
    const room = [host.clientWidth - 48, host.clientHeight - 48];
    return Math.min(...[0, 1].map(a => room[a] / Math.max(1, hi[a] - lo[a])));
  };
  const reach = () => graph.setZoomRange([Math.max(1e-4, Math.min(ZOOM_FLOOR, needed() * 0.95)), 2.5]);
  const fit = async () => {
    reach();
    await graph.fitView();
    if (graph.getZoom() > 1) await graph.zoomTo(1);
    await graph.fitCenter();
  };
  await graph.render();
  await fit();
  document.getElementById('fit').onclick = () => { reach(); graph.fitView(); };
  let selected = null;
  // A Map, so a recipe ID such as `constructor` never reads an inherited property.
  let marks = new Map();
  // Every element's states: its comparison mark under the selection, which draws over it.
  const statesOf = id => [...(marks.has(id) ? [marks.get(id)] : []), ...(id === selected ? ['selected'] : [])];
  addEventListener('message', event => {
    let message;
    try { message = JSON.parse(event.data); } catch { return; }
    if (message?.v !== VERSION) return;
    const touched = new Set();
    if (Object.hasOwn(message, 'marks')) {
      const given = message.marks;
      if (given === null || typeof given !== 'object' || Array.isArray(given)) return;
      const entries = Object.entries(given);
      if (entries.length > ids.size) return;
      const next = new Map();
      for (const [id, mark] of entries) {
        if (ids.has(id) && typeof mark === 'string' && MARKS.includes(mark)) next.set(id, mark);
      }
      for (const id of [...marks.keys(), ...next.keys()]) touched.add(id);
      marks = next;
    } else {
      const next = message.selection;
      if (next !== null && !(typeof next === 'string' && ids.has(next))) return;
      if (selected) touched.add(selected);
      if (next) touched.add(next);
      selected = next;
    }
    const states = {};
    for (const id of touched) states[own(id)] = statesOf(id);
    graph.setElementState(states, false).catch(console.error);
  });
  new ResizeObserver(() => { graph.resize(host.clientWidth, host.clientHeight); fit().catch(console.error); }).observe(host);
  notify('ready');
}
start().catch(error => { console.error(error); host.textContent = 'The diagram could not be drawn.'; notify('failed'); });
</script>
